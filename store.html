function npcTalk(n){if(!$("panel").hidden||TRIP||mode!=="shop")return;const d=pick(TALKS)();n.userData.talk=false;talker=null;nextTalk=performance.now()+40000+Math.random()*25000;let log=`<div class="b"><span>${n.userData.e}</span><div>${L(d.q[0],d.q[1],d.q[2])}</div></div>`;
  const draw=()=>{panel(`<h2><span>💬 ${n.userData.e} ${L("شخص يكلّمك","","Someone is talking to you")}</span><button class="x">✕</button></h2><div class="log">${log}</div><div class="opts">${d.opts.map((o,i)=>`<button class="btn big" data-t="${i}">${L(o[0],o[1],o[2])}</button>`).join("")}</div>`);
    $("pcard").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const o=d.opts[+b.dataset.t];log+=`<div class="b me"><span>${me.e}</span><div>${L(o[0],o[1],o[2])}</div></div><div class="b"><span>${n.userData.e}</span><div>${L(o[3]?d.ok:d.bad,"",o[3]?d.okE:d.badE)}</div></div>`;
      if(o[3]){tone(880,.08);addScore(1);panel(`<h2><span>💬 ${n.userData.e}</span><button class="x">✕</button></h2><div class="log">${log}</div><div class="opts"><button class="btn big" id="tOk">${L("مع السلامة 👋","maʿa al-salama","Goodbye")}</button></div>`);$("tOk").onclick=closeP;}else{tone(200,.15);d.opts=d.opts.filter(x=>x!==o);draw();}});};
  draw();}

/* ---------- 🎲 random events ---------- */
let spill=null,lost=null,tempOff=null;const hemi=scene.children.find(o=>o.isHemisphereLight);
function storeEvent(){const ev=pick(["offer","spill","lost","power"].filter(e=>!(e==="spill"&&spill)&&!(e==="lost"&&lost)));
  if(ev==="offer"){const i=pick([...Array(36).keys()].filter(i=>!SLOTS[i].off));const s=SLOTS[i];const old=s.off;s.off=Math.max(1,Math.round(s.p*0.6));refreshShelves();tempOff=i;
    toast(`📢 إعلان: عرض خاص على ${s.e} ${s.ar}! الآن ${ar(s.off)} ر.س فقط لمدّة دقيقة!`,`iʿlan: ʿard khass ʿala ${s.tr||s.ar}!`,`Announcement: special offer on ${s.en||s.ar}, only ${s.off} riyals for one minute!`,7000);tone(660,.15);tone(880,.15,.2);
    setTimeout(()=>{s.off=old||0;refreshShelves();},60000);}
  if(ev==="spill"){const z=pick(CORR),x=-8+Math.random()*12;const g=new THREE.Group();const pud=new THREE.Mesh(new THREE.CircleGeometry(.7,24),new THREE.MeshBasicMaterial({color:0xfff59d,transparent:true,opacity:.8}));pud.rotation.x=-Math.PI/2;pud.position.y=.02;g.add(pud);
    const sign=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex("⚠️")}));sign.scale.set(.6,.6,.6);sign.position.set(.5,.4,0);g.add(sign);g.position.set(x,0,z);scene.add(g);spill={g,x,z,hit:false};
    toast("💦 انسكب عصير في أحد الممرّات! انتبه للأرضيّة المبلّلة ⚠️","insakaba ʿasir! intabih!","Juice spilled in an aisle! Watch out for the wet floor!",6000);
    setTimeout(()=>{if(spill){scene.remove(spill.g);spill=null;toast("🧹 نظّف العامل الأرضيّة. شكراً لصبرك!","nazzafa al-ʿamil al-ardiyya","The cleaner mopped the floor. Thanks for waiting!");}},45000);}
  if(ev==="lost"){const kid=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex("👦")}));kid.scale.set(.8,.8,.8);kid.position.set(P.x-Math.sin(P.yaw)*1.8,.9,P.z-Math.cos(P.yaw)*1.8);if(hit(kid.position.x,kid.position.z))kid.position.set(P.x,0.9,P.z-1.2);scene.add(kid);
    const mz=pick(CORR),mx=pick([-9,3]);const mom=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex("👩")}));mom.scale.set(1.25,1.25,1.25);mom.position.set(mx,1.35,mz);scene.add(mom);
    const mark=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex("❗")}));mark.scale.set(.5,.5,.5);mark.position.set(mx,2.3,mz);scene.add(mark);lost={kid,mom,mark,found:false,helping:false};
    panel(`<h2><span>👦 طفل ضائع!</span><button class="x">✕</button></h2><div class="log"><div class="b"><span>👦</span><div>${L("أين أمّي؟ 😢 لا أجدها!","ayna ummi? la ajiduha!","Where's my mum? I can't find her!")}</div></div></div>
      <div class="opts"><button class="btn big" id="lHelp">${L("لا تخف، سأساعدك! 🤝","la takhaf, sa-usaʿiduk!","Don't worry, I'll help you!")}</button><button class="btn big" id="lNo">${L("لا أستطيع الآن.","la astatiʿ al-an.","I can't right now.")}</button></div>`);
    $("lHelp").onclick=()=>{lost.helping=true;closeP();toast("👩❗ ابحث عن أمّه في المتجر — فوقها علامة ❗","ibhath ʿan ummihi","Find his mum in the store — she has a ❗ above her",7000);};
    $("lNo").onclick=()=>{closeP();setTimeout(()=>{if(lost&&!lost.helping){toast("🧕 الكاشيرة: سأساعد الطفل. لا بأس.","","The cashier will help the child.");clearLost();}},2000);};}
  if(ev==="power"&&hemi){const old=hemi.intensity;hemi.intensity=.12;scene.background=new THREE.Color(0x263238);tone(120,.5,0,"sawtooth",.05);toast("⚡ انقطعت الكهرباء! لا تتحرّك…","inqataʿat al-kahraba'!","Power cut! Stay still…",3500);
    setTimeout(()=>{hemi.intensity=old;scene.background=new THREE.Color(0xe3f2fd);toast("💡 عادت الكهرباء. الحمد لله!","ʿadat al-kahraba'","The power is back!");},4000);}
  nextEvent=performance.now()+50000+Math.random()*30000;}
function clearLost(){if(!lost)return;[lost.kid,lost.mom,lost.mark].forEach(o=>scene.remove(o));lost=null;}
function tickWorld(dt,now){if(TRIP||mode!=="shop"){return;}
  NPCS.forEach(n=>{const u=n.userData;n.position.y=1.35+Math.abs(Math.sin(now/260+u.npc))*.05;
    if(u.talk){const dx=P.x-n.position.x,dz=P.z-n.position.z,d=Math.hypot(dx,dz);if(d<1.7){npcTalk(n);return;}const sp=1.6*dt;n.position.x+=dx/d*sp;n.position.z+=dz/d*sp;return;}
    {const ax=n.position.x-P.x,az=n.position.z-P.z,ad=Math.hypot(ax,az);if(ad<1.3&&ad>0.01){n.position.x+=ax/ad*(1.3-ad);n.position.z+=az/ad*(1.3-ad);}}
    if(!u.path.length)npcPath(n);const t=u.path[0],dx=t.x-n.position.x,dz=t.z-n.position.z,d=Math.hypot(dx,dz);if(d<.1){u.path.shift();return;}const sp=Math.min(d,1.1*dt);n.position.x+=dx/d*sp;n.position.z+=dz/d*sp;});
  if($("panel").hidden&&now>nextTalk&&!talker){const n=NPCS.slice().sort((a,b)=>Math.hypot(a.position.x-P.x,a.position.z-P.z)-Math.hypot(b.position.x-P.x,b.position.z-P.z))[0];talker=n;n.userData.talk=true;nextTalk=now+90000;}
  if($("panel").hidden&&now>nextEvent)storeEvent();
  if(spill&&!spill.hit&&Math.hypot(P.x-spill.x,P.z-spill.z)<.8){spill.hit=true;P.z+=(P.z>spill.z?1:-1)*.9;P.pitch=-.5;tone(200,.3,0,"triangle");toast("😵 انزلقت! انتبه للأرضيّة المبلّلة ⚠️","inzalaqta!","You slipped! Watch the wet floor!");setTimeout(()=>{P.pitch=-.05;if(spill)spill.hit=false;},1200);}
  if(lost&&lost.helping){const k=lost.kid.position,tx=P.x-Math.sin(P.yaw+.7)*1.8,tz=P.z-Math.cos(P.yaw+.7)*1.8;k.x+=(tx-k.x)*Math.min(1,dt*3);k.z+=(tz-k.z)*Math.min(1,dt*3);
    if(Math.hypot(P.x-lost.mom.position.x,P.z-lost.mom.position.z)<2.2&&$("panel").hidden){lost.helping=false;addScore(3);yay();
      panel(`<h2><span>👩 وجدتَ الأمّ!</span><button class="x">✕</button></h2><div class="log"><div class="b"><span>👩</span><div>${L("ابني! الحمد لله! شكراً جزيلاً لك 💛","ibni! al-hamdu lillah! shukran jazilan lak","My son! Thank God! Thank you so much!")}</div></div><div class="b"><span>👦</span><div>${L("ماما! 🤗","mama!","Mum!")}</div></div></div>
        <div class="opts"><button class="btn big" id="lDone">${L("العفو! انتبها لبعضكما 😊","al-ʿafw!","You're welcome! Look after each other.")}</button></div><div class="win">⭐⭐⭐</div>`.replace("وجدتَ",G("وجدتَ","وجدتِ")));$("lDone").onclick=()=>{closeP();clearLost();};}}
}

/* ---------- 🏠 trip: apartment → car → drive → store, and back ---------- */
function tripBox(html){const t=$("trip");t.innerHTML=`<div class="tcard">${html}</div>`;t.hidden=false;}
function tsay(a,tr,en){return `<div class="tsay">${a}<small class="tr">${tr}</small><small class="en">${en}</small></div>`;}
function startTrip(dir){TRIP=dir;closeP();setHint("");$("actB").hidden=true;Object.keys(keys).forEach(k=>keys[k]=0);
  if(dir==="go"){rollMoney();BOUGHT=[];aptDoor();}else carStep();
  function aptDoor(){tripBox(`<h2>🏢 ${L("عمارتك","ʿimaratuk","Your building")}</h2>${tsay(`${G("أنتَ","أنتِ")} ذاهب${G("","ة")} إلى السوبرماركت! اضغط${G("","ي")} زرّ الخروج بجانب باب العمارة.`,"anta dhahib ila al-subirmarkit! idghat zirr al-khuruj bi-janib bab al-ʿimara.","You're going to the supermarket! Press the exit button next to the building door.")}
      <div class="tdoorwrap"><div class="tframe"><div class="tdoor" id="tDoor"><i></i><b>🚪</b></div><div class="tout">🌤️🌳🚗</div></div><button class="texit" id="tEx"><b>🔓</b>${L("زرّ الخروج","zirr al-khuruj","Exit button")}</button></div>
      <div class="center tmoney">${L(`في محفظتك 💵 ${ar(WAL.cash)} · في بطاقتك 💳 ${ar(WAL.bank)}`,"",`Wallet: ${WAL.cash} · Card: ${WAL.bank}`)}</div>`);
    $("tEx").onclick=()=>{$("tDoor").classList.add("open");$("tEx").disabled=true;tone(1200,.08,0,"square",.05);tone(300,.3,.1,"triangle");setTimeout(carStep,1300);};}
  function carStep(){let st=0;const S=[[dir==="go"?"هذه سيّارتك! اضغط على السيّارة لتركبها.":"انتهى التسوّق! اذهب إلى سيّارتك واضغط عليها لتركبها.",dir==="go"?"hadhihi sayyaratuk! idghat ʿalayha li-tarkabaha.":"intaha al-tasawwuq! idhhab ila sayyaratik.",dir==="go"?"This is your car! Tap it to get in.":"Shopping's done! Go to your car and tap it to get in.",null],
      ["جلستَ في السيّارة. اربط الحزام! 🔒","jalasta fi al-sayyara. irbut al-hizam!","You're in the car. Fasten your seatbelt!",["🔒 اربط الحزام","irbut al-hizam","Fasten seatbelt"]],
      [dir==="go"?"شغّل السيّارة وقُدها إلى السوبرماركت! 🔑":"شغّل السيّارة وقُدها إلى البيت! 🔑",dir==="go"?"shaghghil al-sayyara wa qudha ila al-subirmarkit!":"shaghghil al-sayyara wa qudha ila al-bayt!",dir==="go"?"Start the car and drive to the supermarket!":"Start the car and drive home!",["🔑 شغّل وقُد","shaghghil wa qud","Start & drive"]]];
    const draw=()=>{const s=S[st];tripBox(`<h2>🚗 ${L("السيّارة","al-sayyara","The car")}</h2>${tsay(s[0].replace("جلستَ",G("جلستَ","جلستِ")),s[1],s[2])}
      <div class="tstreet">${dir==="home"?`<span class="tshop">🏪</span>`:`<span class="tshop">🏢</span>`}<div class="tcar ${st?"in":""}" id="tCar">🚗${st?`<span>${me.e}</span>`:""}</div></div>
      ${st===0&&dir==="go"&&window.ROADDRIVE?ROADDRIVE.pickerHtml():""}${s[3]?`<div class="opts"><button class="btn big" id="tN">${L(s[3][0],s[3][1],s[3][2])}</button></div>`:""}`);if(window.ROADDRIVE)ROADDRIVE.bindPicker($("trip"));
      if(!st)$("tCar").onclick=()=>{st=1;tone(400,.1);draw();};else $("tN").onclick=()=>{if(st===2){tone(110,.4,0,"sawtooth",.06);tone(170,.4,.3,"sawtooth",.05);setTimeout(drive,700);}else{tone(900,.06);st++;draw();}};};draw();}
  function drive(){tripBox(`<h2>🛣️ ${dir==="go"?L("إلى السوبرماركت","ila al-subirmarkit","To the supermarket"):L("إلى البيت","ila al-bayt","Home")}</h2><div id="rdBox"></div>`);
    window.__rd=ROADDRIVE.open({el:$("rdBox"),dir:dir==="go"?"out":"in",dest:dir==="go"?"🏪":"🏢",tone,onDone:r=>{if(r.stars)addScore(r.stars);setTimeout(dir==="go"?arriveStore:gate,250);}});}
  function arriveStore(){tripBox(`<div class="center big-e">🏪</div>${tsay(`وصلتَ إلى السوبرماركت! ادخل وتسوّق.`.replace("وصلتَ",G("وصلتَ","وصلتِ")).replace("ادخل وتسوّق",G("ادخل وتسوّق","ادخلي وتسوّقي")),"wasalta ila al-subirmarkit! udkhul wa tasawwaq.","You've arrived at the supermarket! Go in and shop.")}
      <div class="opts"><button class="btn big green" id="tIn">${L("🛒 ادخل المتجر","udkhul al-matjar","Enter the store")}</button></div>`);
    $("tIn").onclick=()=>{$("trip").hidden=true;TRIP=null;tryLock();P.x=0;P.z=8.2;P.yaw=0;P.pitch=-.05;newList();drawSide();nextTalk=performance.now()+20000;nextEvent=performance.now()+35000;toast("📝 قائمة التسوّق على اليمين · 🏧 الصرّاف على اليسار","","Shopping list on the right · ATM on the left");};}
  function gate(){tripBox(`<h2>🏢 ${L("بوّابة العمارة","bawwabat al-ʿimara","Building gate")}</h2>${tsay(`وصلتَ إلى العمارة! امسح بطاقتك على الجهاز لتدخل.`.replace("وصلتَ",G("وصلتَ","وصلتِ")),"wasalta ila al-ʿimara! imsah bitaqataka ʿala al-jihaz.","You're at the building! Scan your card on the reader to get in.")}
      <div class="tgatewrap"><div class="tgate"><div class="tbars" id="tBars"></div><span>🏢 عمارة النجوم</span></div><div class="tscan" id="tScan"><div class="tled" id="tLed"></div><b>📶</b><small>ضع البطاقة هنا</small></div></div>
      <div class="center">💳 ${L("حرّك البطاقة بالفأرة أو بإصبعك إلى الجهاز","harrik al-bitaqa ila al-jihaz","Move the card to the reader")}</div>`);
    const card=document.createElement("div");card.className="tcardk";card.innerHTML=`<b>🏢 بطاقة العمارة</b><span>${me.name}</span><i>${me.e}</i>`;document.body.appendChild(card);let ok=false;
    const pl=(x,y)=>{card.style.left=x+"px";card.style.top=y+"px";if(ok)return;const r=$("tScan").getBoundingClientRect();if(x>r.left-10&&x<r.right+10&&y>r.top-10&&y<r.bottom+10){ok=true;$("tLed").classList.add("ok");tone(1500,.08,0,"square",.06);tone(1900,.12,.1,"square",.06);
      setTimeout(()=>{$("tBars").classList.add("up");tone(300,.4,0,"triangle");},400);setTimeout(()=>{card.remove();removeEventListener("pointermove",pm);aptDoorIn();},1700);}};
    const pm=e=>pl(e.clientX,e.clientY);addEventListener("pointermove",pm);$("trip").addEventListener("pointerdown",e=>pl(e.clientX,e.clientY),{once:false});const r0=$("tScan").getBoundingClientRect();pl(r0.left-160,r0.bottom);}
  function aptDoorIn(){tripBox(`<h2>🛗 ${L("باب الشقّة","bab al-shaqqa","Apartment door")}</h2>${tsay("صعدتَ بالمصعد إلى شقّتك. الباب يُفتح… 🔑".replace("صعدتَ",G("صعدتَ","صعدتِ")),"saʿidta bil-misʿad ila shaqqatik. al-bab yuftah…","You took the lift up to your apartment. The door is opening…")}
      <div class="tdoorwrap"><div class="tframe"><div class="tdoor" id="tD2"><i></i><b>🏠</b></div><div class="tout home">🛋️📺🪴</div></div></div>`);
    setTimeout(()=>{$("tD2").classList.add("open");tone(400,.2,0,"triangle");tone(600,.2,.15,"triangle");},600);setTimeout(home,2000);}
  function home(){const sum=BOUGHT.reduce((a,x)=>a+x.p*x.q,0);yay();
    tripBox(`<div class="center big-e">🏠✨</div>${tsay(`أهلاً بك في البيت يا ${me.name}!`,"ahlan bika fi al-bayt!","Welcome home!")}
      ${BOUGHT.length?`<div class="rcpt"><b>🛍️ ما اشتريتَه اليوم</b>${BOUGHT.map(x=>`<div><span>${x.e} ${esc(x.ar)} × ${ar(x.q)}</span><span>${ar(x.p*x.q)}</span></div>`).join("")}<div class="t"><span>المجموع</span><span>${ar(sum)} ر.س</span></div></div>`.replace("اشتريتَه",G("اشتريتَه","اشتريتِه")):`<div class="center">${L("لم تشترِ شيئاً هذه المرّة 🙂","","You didn't buy anything this time.")}</div>`}
      <div class="center tmoney">💵 ${ar(WAL.cash)} · 💳 ${ar(WAL.bank)} · ⭐ ${ar(SCORE)}</div>
      <div class="opts"><button class="btn big green" id="tAgain">${L("🛒 اذهب للتسوّق مرّة أخرى","idhhab lil-tasawwuq marratan ukhra","Go shopping again")}</button><button class="btn big" id="tBack">${L("🏢 ارجع إلى لعبة العمارة","irjiʿ ila luʿbat al-ʿimara","Back to the building game")}</button></div>`);
    $("tAgain").onclick=()=>startTrip("go");$("tBack").onclick=()=>{location.href="./";};}
}

/* ---------- modes ---------- */
function setMode(m){mode=m;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));closeP();
  $("pad").style.display=m==="shop"?"grid":"none";$("help").style.display=m==="shop"?"":"none";
  custSp.visible=false;beltSprites.forEach(s=>scene.remove(s));beltSprites=[];CLOG="";PAY.items=[];PAY.total=0;PAY.status="wait";updPay();
  if(m==="cash")cashStart();if(m==="edit")openEdit();drawSide();setHint("");}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("back").onclick=()=>{location.href="./";};
$("panel").addEventListener("pointerdown",e=>{if(e.target===$("panel")&&mode!=="cash")closeP();});

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
let last=performance.now(),hintT=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);tickWorld(dt,t);placeCam();renderer.render(scene,cam);if(t-hintT>150){hintT=t;updHint();if(isLocked()&&!lockOK())unlock();drawLock();}requestAnimationFrame(loop);}
newList();setMode("shop");drawWal();requestAnimationFrame(loop);startTrip("go");
window.STORE={startTrip,openATM,tryExit,WAL:()=>WAL,storeEvent,npcTalk,NPCS,tickWorld,THREE,cam,P,SLOTS:()=>SLOTS,CART:()=>CART,setMode,openProduct,startCheckout,CASH,scanBelt,beltSprites:()=>beltSprites,cashAct,PAY};
</script>
