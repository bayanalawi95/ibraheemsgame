<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>لعبة رف المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#263238;--gold:#ffc107;--ok:#2e7d32;--bad:#c62828;--blue:#1565c0}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#cfd8dc;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}

.title{font-size:1.05rem}.sp{flex:1}
small.tr{display:block;font-size:.7rem;font-weight:600;opacity:.75;direction:ltr}small.en{display:block;font-size:.7rem;font-weight:700;color:var(--blue);direction:ltr;font-style:italic}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:#fff;text-shadow:0 0 4px #000;pointer-events:none;z-index:4}

#list{position:fixed;top:60px;right:8px;background:#fffffff0;border-radius:14px;padding:8px 10px;z-index:4;min-width:170px;box-shadow:0 2px 6px #0003;font-size:.9rem}
#list b{display:block;margin-bottom:3px}#list div.ok{text-decoration:line-through;color:var(--ok)}
#cartbox{position:fixed;top:60px;left:8px;background:#fffffff0;border-radius:14px;padding:8px 10px;z-index:4;min-width:170px;max-width:240px;box-shadow:0 2px 6px #0003;font-size:.88rem;max-height:46vh;overflow:auto}
#cartbox .ci{display:flex;justify-content:space-between;gap:6px;align-items:center}#cartbox .ci button{border:0;background:#ffebee;border-radius:50%;width:22px;height:22px;cursor:pointer}
#pad{position:fixed;bottom:14px;left:14px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;z-index:5;direction:ltr}
#pad button{border:0;border-radius:16px;background:#ffffffd9;font-size:1.6rem;box-shadow:0 2px 6px #0004;cursor:pointer;touch-action:none}
#pad .up{grid-column:2}#pad .lt{grid-column:1;grid-row:2}#pad .dn{grid-column:2;grid-row:2}#pad .rt{grid-column:3;grid-row:2}
#act{position:fixed;bottom:18px;right:14px;z-index:5}
#panel{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:62px 10px 10px}
#panel[hidden]{display:none}
.card{background:#fff;border-radius:20px;padding:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 30px #0006}
.card h2{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font-size:1.25rem}
.x{border:0;background:#eceff1;border-radius:12px;padding:4px 10px;font-size:1.1rem;cursor:pointer}
.center{text-align:center}.big-e{font-size:4rem;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}.opts .btn{width:100%;background:var(--gold)}
.log{max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0}
.b{display:flex;gap:6px;align-items:flex-end}.b.me{flex-direction:row-reverse}.b>span{font-size:1.6rem}.b>div{background:#f1f1f1;border-radius:14px;padding:6px 10px;font-weight:700;max-width:82%}.b.me>div{background:#dcf8c6}
.alert{background:#ffebee;color:var(--bad);border-radius:12px;padding:6px 10px;font-weight:800;margin:6px 0;text-align:center}
.win{background:#e8f5e9;color:var(--ok);border-radius:12px;padding:6px 10px;font-weight:800;margin:6px 0;text-align:center}
.pinpad,.wallet,.coins{display:grid;gap:8px;justify-content:center;margin:8px auto;direction:ltr}
.pinpad{grid-template-columns:repeat(3,64px)}.pinpad button{height:56px;font-size:1.4rem;font-weight:900;border-radius:14px;border:2px solid #ddd;background:#f7f7f7;cursor:pointer}
.wallet{grid-template-columns:repeat(4,1fr)}.wallet button{border:2px solid #81c784;background:#e8f5e9;border-radius:12px;padding:8px 4px;font-weight:900;cursor:pointer;font-size:1rem}
.coins{grid-template-columns:repeat(5,1fr)}.coins button{border:2px solid #b8860b;background:radial-gradient(#ffe082,#ffb300);border-radius:50%;height:56px;font-weight:900;cursor:pointer}
.scr{background:#102027;color:#a5d6a7;font-family:monospace;border-radius:10px;padding:6px 10px;text-align:center;font-size:1.3rem;letter-spacing:4px;direction:ltr}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.slot{border:2px solid #e0e0e0;border-radius:10px;background:#fafafa;padding:3px;text-align:center;cursor:pointer}.slot span{font-size:1.5rem;display:block}.slot small{font-size:.62rem;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.offer{border-color:#ff7043;background:#fff3e0}
.facehd{margin:8px 0 3px;font-weight:900}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:3px;max-height:140px;overflow:auto;margin:6px 0}.emo button{font-size:1.4rem;border:2px solid #eee;background:#fff;border-radius:8px;cursor:pointer}.emo button.on{border-color:#43a047;background:#e8f5e9}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row input{font:inherit;font-size:1rem;padding:7px;border-radius:10px;border:2px solid #ddd;flex:1;min-width:90px}
.rcpt{background:#fff;border:1px dashed #9e9e9e;border-radius:8px;padding:8px 12px;margin:8px auto;max-width:320px}.rcpt div{display:flex;justify-content:space-between}.rcpt .t{border-top:1px dashed #9e9e9e;margin-top:4px;padding-top:4px;font-weight:900}
@media (max-width:700px){#list,#cartbox{font-size:.75rem;min-width:130px;top:auto;bottom:150px}#list{right:8px}#cartbox{left:auto;right:8px;bottom:280px;display:none}.grid{grid-template-columns:repeat(4,1fr)}}
#help{position:fixed;bottom:150px;left:14px;font-size:.75rem;background:#ffffffd0;border-radius:10px;padding:4px 8px;z-index:4;pointer-events:none}
@media (max-width:700px){#help{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross">＋</div>
<div id="hud">
  <button class="btn" id="back">↩️ رجوع</button>

<div id="cartbox"></div>

<div id="act"><button class="btn big green" id="actB" hidden></button></div>
<div id="panel" hidden><div class="card" id="pcard"></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);

const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=(a,t,e)=>`${a}${t?`<small class="tr">${t}</small>`:""}${e?`<small class="en">${e}</small>`:""}`;
let AC=null;function tone(f,d,t=0,type="sine",v=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02);}catch(e){}}
const beep=()=>tone(1500,.08,0,"square",.06),yay=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,i*.1,"triangle"));
const pick=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>a.slice().sort(()=>Math.random()-.5);
// who is playing (from the main game login)
let me={name:"إبراهيم",g:"m",e:"👦"};try{const a=JSON.parse(localStorage.getItem("tower-auth")||"null");if(a&&a.pl==="by")me={name:"بيان",g:"f",e:"👩‍🏫"};}catch(e){}
const G=(m,f)=>me.g==="f"?f:m;

/* ---------- catalogue: 3 shelf units × 2 faces × 6 columns ---------- */
const FACES=[["🍎","فواكه وخضار","Fruit & Veg"],["🥖","مخبز وألبان","Bakery & Dairy"],["🥤","مشروبات وسناكات","Drinks & Snacks"],["🧼","منظّفات","Cleaning"],["📱","إلكترونيّات","Electronics"],["🧸","ألعاب وقرطاسيّة","Toys & Stationery"]];
const DEF=[
 ["🍎","تفّاح","tuffah","apples",3],["🍌","موز","mawz","bananas",4],["🍇","عنب","ʿinab","grapes",6],["🍉","بطّيخ","battikh","watermelon",12],["🥕","جزر","jazar","carrots",2],["🍅","طماطم","tamatim","tomatoes",3],
 ["🍞","خبز","khubz","bread",2],["🥐","كرواسون","kruwasun","croissant",5],["🥛","حليب","halib","milk",5],["🧀","جبن","jubn","cheese",7],["🥚","بيض","bayd","eggs",6],["🧈","زبدة","zubda","butter",8],
 ["🧃","عصير","ʿasir","juice",3],["💧","ماء","ma'","water",1],["🥤","مشروب غازيّ","mashrub ghazi","soda",3],["🍪","بسكويت","baskawit","cookies",4],["🍫","شوكولاتة","shukulata","chocolate",4],["🍿","فشار","fushar","popcorn",5],
 ["🧼","صابون","sabun","soap",4],["🧴","شامبو","shambu","shampoo",12],["🧻","مناديل","manadil","tissues",6],["🪥","فرشاة أسنان","furshat asnan","toothbrush",5],["🧽","إسفنجة","isfanja","sponge",3],["🪣","دلو","dalw","bucket",12],
 ["📱","جوّال","jawwal","phone",900],["🎧","سمّاعة","sammaʿa","headphones",150],["🔋","بطّاريّة","battariyya","battery",10],["🔌","شاحن","shahin","charger",35],["🖱️","فأرة","fa'ra","mouse",50],["💡","مصباح","misbah","light bulb",15],
 ["🧸","دبدوب","dabdub","teddy bear",30],["⚽","كرة","kura","ball",20],["🧩","أحجية","uhjiyya","puzzle",35],["✏️","قلم","qalam","pencil",1],["📒","دفتر","daftar","notebook",5],["🎨","ألوان","alwan","paints",10]];
const KEY="store-shelf-v1";
let SLOTS;try{SLOTS=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
if(!Array.isArray(SLOTS)||SLOTS.length!==36)SLOTS=DEF.map(d=>({e:d[0],ar:d[1],tr:d[2],en:d[3],p:d[4],off:0}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SLOTS));}catch(e){}};
// daily offers if none chosen
if(!SLOTS.some(s=>s.off)){shuf([...Array(36).keys()]).slice(0,3).forEach(i=>{SLOTS[i].off=Math.max(1,Math.round(SLOTS[i].p*0.7));});}
const price=s=>s.off&&s.off<s.p?s.off:s.p;

/* ---------- three.js scene ---------- */
const canvas=$("c"),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe3f2fd);scene.fog=new THREE.Fog(0xe3f2fd,18,40);
const cam=new THREE.PerspectiveCamera(70,1,.05,80);
scene.add(new THREE.HemisphereLight(0xffffff,0x90a4ae,1.1));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(5,10,6);scene.add(dl);
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;t._c=c;t._draw=draw;return t;}
function redraw(t){const x=t._c.getContext("2d");x.clearRect(0,0,t._c.width,t._c.height);t._draw(x,t._c.width,t._c.height);t.needsUpdate=true;}
const FONT=`"Tajawal","Segoe UI",Arial,sans-serif`;
// floor / walls / ceiling
const floorT=canvasTex(256,256,(x,w,h)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?"#eceff1":"#cfd8dc";x.fillRect(i*64,j*64,64,64);}});floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping;floorT.repeat.set(15,10);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,20),new THREE.MeshStandardMaterial({map:floorT}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(30,20),new THREE.MeshStandardMaterial({color:0xfafafa}));ceil.rotation.x=Math.PI/2;ceil.position.y=4;scene.add(ceil);
const wallM=new THREE.MeshStandardMaterial({color:0xfff8e1});
[[0,2,-10,30,0],[0,2,10,30,Math.PI],[-15,2,0,20,Math.PI/2],[15,2,0,20,-Math.PI/2]].forEach(([x,y,z,w,r])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,4),wallM);m.position.set(x,y,z);m.rotation.y=r;scene.add(m);});
for(let i=-12;i<=12;i+=6)for(let j=-6;j<=6;j+=6){const l=new THREE.Mesh(new THREE.BoxGeometry(2.2,.06,.4),new THREE.MeshBasicMaterial({color:0xffffff}));l.position.set(i,3.97,j);scene.add(l);}
// shelf units
const BOXES=[];const shelfM=new THREE.MeshStandardMaterial({color:0x8d6e63}),boardM=new THREE.MeshStandardMaterial({color:0xd7ccc8});
const UNITS=[-6,-1.5,3];const UX=-2,ULEN=13.2;
const emoTex={};const eTex=e=>emoTex[e]||(emoTex[e]=canvasTex(128,128,(x,w,h)=>{x.font=`100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillText(e,64,70);}));
const prodSprites=[],tagMeshes=[];
UNITS.forEach((uz,u)=>{
  const body=new THREE.Mesh(new THREE.BoxGeometry(ULEN,2.2,.5),shelfM);body.position.set(UX,1.1,uz);scene.add(body);
  for(let lv=0;lv<3;lv++){const bd=new THREE.Mesh(new THREE.BoxGeometry(ULEN,.05,1.3),boardM);bd.position.set(UX,.35+lv*.7,uz);scene.add(bd);}
  BOXES.push({x1:UX-ULEN/2-.1,x2:UX+ULEN/2+.1,z1:uz-.75,z2:uz+.75});
  [1,-1].forEach((side,fi)=>{const face=u*2+fi;
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.55),new THREE.MeshBasicMaterial({map:canvasTex(512,90,(x,w,h)=>{x.fillStyle="#1565c0";x.fillRect(0,0,w,h);x.fillStyle="#fff";x.font=`900 52px ${FONT}`;x.textAlign="center";x.textBaseline="middle";x.direction="rtl";x.fillText(`${FACES[face][0]} ${FACES[face][1]}`,w/2,h/2+4);})}));
    sign.position.set(UX,2.55,uz+side*.27);sign.rotation.y=side>0?0:Math.PI;scene.add(sign);
    for(let col=0;col<6;col++){const si=face*6+col,cx=UX-ULEN/2+1.1+col*2.2*(side>0?1:1);const xx=side>0?cx:UX+ULEN/2-1.1-col*2.2;
      for(let lv=0;lv<3;lv++)for(let k=0;k<3;k++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex(SLOTS[si].e)}));sp.scale.set(.5,.5,.5);sp.position.set(xx-.55+k*.55,.62+lv*.7,uz+side*.5);sp.userData={slot:si};scene.add(sp);prodSprites.push(sp);}
      const tag=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.36),new THREE.MeshBasicMaterial({map:tagTex(si)}));tag.position.set(xx,.2,uz+side*.66);tag.rotation.y=side>0?0:Math.PI;tag.userData={slot:si};scene.add(tag);tagMeshes.push(tag);}
  });
});
function tagTex(si){return canvasTex(300,72,(x,w,h)=>{const s=SLOTS[si];x.fillStyle=s.off?"#ff7043":"#ffeb3b";x.fillRect(0,0,w,h);x.fillStyle="#263238";x.direction="rtl";x.textBaseline="middle";
  x.font=`800 28px ${FONT}`;x.textAlign="right";x.fillText(s.ar.slice(0,12),w-10,h/2+2);x.textAlign="left";x.font=`900 30px ${FONT}`;x.fillText(`${ar(price(s))} ر.س`,10,h/2+2);
  if(s.off){x.font=`700 16px ${FONT}`;x.fillText(`كان ${ar(s.p)}`,12,13);}});}
function refreshShelves(){prodSprites.forEach(sp=>{sp.material.map=eTex(SLOTS[sp.userData.slot].e);sp.material.needsUpdate=true;});tagMeshes.forEach(t=>{t.material.map.dispose();t.material.map=tagTex(t.userData.slot);t.material.needsUpdate=true;});redraw(promoT);}
// checkout counter + cashier + payment screen
const CX=11,CZ=6;
const counter=new THREE.Mesh(new THREE.BoxGeometry(3.4,1,1.1),new THREE.MeshStandardMaterial({color:0x546e7a}));counter.position.set(CX,.5,CZ);scene.add(counter);BOXES.push({x1:CX-1.8,x2:CX+1.8,z1:CZ-.65,z2:CZ+.65});
const belt=new THREE.Mesh(new THREE.BoxGeometry(2.2,.04,.7),new THREE.MeshStandardMaterial({color:0x37474f}));belt.position.set(CX-.4,1.02,CZ);scene.add(belt);
const cashierSp=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex("🧕")}));cashierSp.scale.set(1.3,1.3,1.3);cashierSp.position.set(CX+.6,1.55,CZ-1.1);scene.add(cashierSp);
const PAY={items:[],total:0,status:"wait",pin:0,given:0};
const payT=canvasTex(512,320,(x,w,h)=>{x.fillStyle="#102027";x.fillRect(0,0,w,h);x.strokeStyle="#455a64";x.lineWidth=14;x.strokeRect(0,0,w,h);x.direction="rtl";x.textAlign="right";
  x.fillStyle="#80cbc4";x.font=`900 34px ${FONT}`;x.fillText("🧾 شاشة الدفع",w-24,48);x.font=`700 26px ${FONT}`;x.fillStyle="#e0f2f1";
  PAY.items.slice(-4).forEach((it,i)=>{x.textAlign="right";x.fillText(`${it.e} ${it.ar}${it.q>1?" × "+ar(it.q):""}`,w-24,95+i*36);x.textAlign="left";x.fillText(ar(it.q*it.p),24,95+i*36);});
  x.textAlign="right";x.fillStyle="#fff59d";x.font=`900 38px ${FONT}`;x.fillText("المجموع",w-24,h-70);x.textAlign="left";x.fillText(`${ar(PAY.total)} ر.س`,24,h-70);
  const st={wait:["⏳ بانتظار الدفع","#ef6c00"],scan:["📟 جارٍ المسح…","#1565c0"],pin:[`💳 الرمز ${"●".repeat(PAY.pin)}`,"#ef6c00"],cash:[`💵 المدفوع ${ar(PAY.given)}`,"#ef6c00"],ok:["✅ تمّ الدفع","#2e7d32"]}[PAY.status]||["",""];
  x.fillStyle=st[1];x.fillRect(16,h-48,w-32,36);x.fillStyle="#fff";x.textAlign="center";x.font=`900 26px ${FONT}`;x.fillText(st[0],w/2,h-22);});
const payScreen=new THREE.Mesh(new THREE.PlaneGeometry(1.3,.8),new THREE.MeshBasicMaterial({map:payT}));payScreen.position.set(CX-1.2,1.6,CZ+.2);payScreen.rotation.y=Math.PI*0.15;scene.add(payScreen);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.6),new THREE.MeshStandardMaterial({color:0x263238}));pole.position.set(CX-1.2,1.15,CZ+.2);scene.add(pole);
const updPay=()=>redraw(payT);
// big offers screen on the back wall

const P={x:0,z:8.2,yaw:0,pitch:-.05};const keys={};let mode="shop";
const fixedCash={x:CX-.5,z:CZ-2.4,yaw:Math.PI,pitch:-.32};
addEventListener("keydown",e=>{if(!$("panel").hidden)return;keys[e.key.toLowerCase()]=1;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();});

document.querySelectorAll("#pad button").forEach(b=>{const k="pad_"+b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1;},off=()=>{keys[k]=0;};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);});
let drag=null,moved=0;
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};moved=0;});
addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);P.yaw-=dx*.005;P.pitch=Math.max(-1,Math.min(.8,P.pitch-dy*.004));drag={x:e.clientX,y:e.clientY};});
addEventListener("pointerup",e=>{if(drag&&moved<8&&e.target===canvas)clickAt(e.clientX,e.clientY);drag=null;});
const hit=(x,z)=>x<-14.4||x>14.4||z<-9.4||z>9.4||BOXES.some(b=>x>b.x1-.3&&x<b.x2+.3&&z>b.z1-.3&&z<b.z2+.3);
function step(dt){if(mode==="cash"||mode==="edit"||!$("panel").hidden)return;
  const f=(keys.w||keys.arrowup||keys.pad_f?1:0)-(keys.s||keys.arrowdown||keys.pad_b?1:0),t=(keys.a||keys.arrowleft||keys.pad_l?1:0)-(keys.d||keys.arrowright||keys.pad_r?1:0);
  P.yaw+=t*dt*1.9;if(f){const sp=3.2*dt*f,nx=P.x-Math.sin(P.yaw)*sp,nz=P.z-Math.cos(P.yaw)*sp;if(!hit(nx,P.z))P.x=nx;if(!hit(P.x,nz))P.z=nz;}}

  cartSp.visible=mode==="shop";cashierSp.visible=mode!=="cash";cartSp.position.set(P.x-Math.sin(P.yaw)*1.1,.6,P.z-Math.cos(P.yaw)*1.1);}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster();ray.camera=cam;
function lookAt(nx,ny){ray.setFromCamera({x:nx,y:ny},cam);const objs=mode==="cash"?beltSprites.concat([cashierSp]):prodSprites.concat(tagMeshes,[cashierSp,counter,payScreen]);
  const h=ray.intersectObjects(objs,false)[0];return h&&h.distance<(mode==="cash"?6:4.5)?h:null;}
function clickAt(cx,cy){if(!$("panel").hidden)return;const r=canvas.getBoundingClientRect(),h=lookAt(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);if(!h)return;const o=h.object;
  if(mode==="cash"){if(o.userData.belt!=null)scanBelt(o);return;}
  if(o.userData.slot!=null){openProduct(o.userData.slot);return;}
  if(o===cashierSp||o===counter||o===payScreen)startCheckout();}
let hintTxt="";function setHint(t){if(t===hintTxt)return;hintTxt=t;const h=$("hint");h.style.display=t?"block":"none";h.innerHTML=t;}

/* ---------- shopper: cart + list ---------- */

function cartQty(i){return CART.filter(c=>c.i===i).reduce((a,c)=>a+c.q,0);}
function cartTotal(){return CART.reduce((a,c)=>a+c.q*price(SLOTS[c.i]),0);}

  $("cartbox").innerHTML=`<b>🛒 العربة</b>${CART.map((c,k)=>{const s=SLOTS[c.i];return `<div class="ci"><span>${s.e} ${esc(s.ar)} × ${ar(c.q)}</span><span>${ar(c.q*price(s))}<button data-rm="${k}">✕</button></span></div>`;}).join("")}<div class="ci"><b>المجموع</b><b>${ar(cartTotal())} ر.س</b></div>`;

  $("cartchip").innerHTML=`🛒 ${ar(CART.reduce((a,c)=>a+c.q,0))} · ${ar(cartTotal())} ر.س`;}
function panel(html){$("pcard").innerHTML=html;$("panel").hidden=false;const x=$("pcard").querySelector(".x");if(x)x.onclick=closeP;}

    else{c.pay=[10,20,50,100,200,500,1000].find(x=>x>=tot&&(x>tot||Math.random()<.3))||1000;PAY.status="cash";PAY.given=c.pay;updPay();giveSum=0;
      cashDlg([["me","هل تدفع نقداً أم بالبطاقة؟"],["them",`نقداً. تفضّل، هذه ${riyal(c.pay)} 💵`,`naqdan. hadhihi ${c.pay}`,`Cash. Here's ${c.pay} riyals.`]],null,changeUI());}return;}
  if(a==="card"){CLOG+=`<div class="b me"><span>🧑‍💼</span><div>💳 جهاز البطاقة جاهز، تفضّل!</div></div>`;let p=0;const iv=setInterval(()=>{p++;PAY.pin=p;updPay();tone(800,.04);if(p>=4){clearInterval(iv);PAY.status="ok";updPay();tone(1300,.1);tone(1700,.15,.12);bye("✅ تمّت العملية بنجاح!");}},350);cashDlg([],[],`<div class="center">💳 ${L("الزبون يُدخل الرمز…","al-zabun yudkhil al-ramz…","The customer is entering the PIN…")}</div>`);return;}
  if(a==="give"){const ch=c.pay-PAY.total;if(giveSum!==ch){c.ok=false;tone(200,.15);giveSum=0;cashDlg([],null,`<div class="alert">${giveSum>ch?"كثير!":"🤔"} الباقي = ${ar(c.pay)} − ${ar(PAY.total)}</div>`+changeUI());return;}
    PAY.status="ok";updPay();CLOG+=`<div class="b me"><span>🧑‍💼</span><div>${L(`تفضّل الباقي: ${riyal(ch)}.`,`tafaddal al-baqi: ${ch}`,`Here's your change: ${ch} riyals.`)}</div></div>`;yay();bye("شكراً! 😊");return;}
  if(a==="exact"){PAY.status="ok";updPay();bye("شكراً! 😊");return;}
  if(a==="bye"){CLOG+=`<div class="b me"><span>🧑‍💼</span><div>تفضّل أغراضك، مع السلامة! 🛍️</div></div>`;if(c.ok)CASH.good++;CASH.served++;CLOG="";closeP();
    const t0=performance.now();const walk=()=>{const k=Math.min(1,(performance.now()-t0)/1200);custSp.position.z=CZ+1.1+(9.5-CZ-1.1)*k;if(k<1)requestAnimationFrame(walk);else{custSp.visible=false;nextCust();}};walk();beltSprites.forEach(s=>scene.remove(s));beltSprites=[];}
}
function changeUI(){const c=CASH.cur,ch=c.pay-PAY.total;if(!ch)return `<div class="opts"><button class="btn big" data-o="exact">${L("شكراً! المبلغ مضبوط 👍","shukran! al-mablagh madbut","Thanks, that's exact!")}</button></div>`;
  setTimeout(()=>{$("pcard").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const v=+b.dataset.g;giveSum=v?giveSum+v:0;tone(v?1000:400,.04);const gb=$("gsum");if(gb)gb.textContent=`الباقي: ${ar(giveSum)} ر.س`;});},0);
  return `<div class="center">${L(`كم الباقي؟ ${ar(c.pay)} − ${ar(PAY.total)}`,"kam al-baqi?",`Change? ${c.pay} − ${PAY.total}`)}</div><div class="coins">${[100,50,10,5,1].map(v=>`<button data-g="${v}">${ar(v)}</button>`).join("")}</div><div class="center"><b id="gsum">الباقي: ${ar(giveSum)} ر.س</b> <button class="btn" data-g="0">↩️</button></div><div class="opts"><button class="btn big" data-o="give">${L("تفضّل الباقي!","tafaddal al-baqi!","Here's your change!")}</button></div>`;}
function bye(t){cashDlg([["them",t,"","Thank you!"]],[["تفضّل أغراضك، مع السلامة! 🛍️","tafaddal aghradak, maʿa al-salama!","Here are your things, goodbye!","bye"]]);}
function totOpts(tot){return shuf([tot,tot+3,Math.max(1,tot-2)]).map(v=>[`المجموع ${riyal(v)}.`,`al-majmuʿ ${v}`,`The total is ${v} riyals.`,"t"+v]);}
function scanBelt(sp){const c=CASH.cur;if(!c||CASH.step!=="scan")return;const si=sp.userData.belt;scene.remove(sp);beltSprites=beltSprites.filter(s=>s!==sp);beep();
  const s=SLOTS[si];PAY.items.push({e:s.e,ar:s.ar,p:price(s),q:1});PAY.total+=price(s);updPay();
  if(!beltSprites.length){CASH.step="total";setHint("");cashDlg([],totOpts(PAY.total),`<div class="center">🧮 ${c.its.map(i=>ar(price(SLOTS[i]))).join(" + ")} = ؟</div>`);}}

/* ---------- edit mode: change products & prices ---------- */
const EMO="🍎 🍌 🍇 🍉 🍓 🍒 🍑 🥭 🍍 🥥 🥝 🍋 🍊 🥑 🥦 🥕 🌽 🥒 🧅 🥔 🍅 🍞 🥐 🥖 🧇 🥞 🧀 🥚 🧈 🥛 🍗 🍖 🍔 🍕 🌭 🥪 🌮 🍟 🍿 🍩 🍪 🎂 🍰 🧁 🍫 🍬 🍭 🍯 🧃 🥤 ☕ 🍵 💧 🍦 🧂 🧼 🧴 🧻 🪥 🧽 🪣 🧹 🧺 📱 💻 🎧 ⌚ 🖱️ ⌨️ 🔋 🔌 📷 🎮 💡 📺 🧸 ⚽ 🪁 🚗 🧩 🤖 🎲 🪀 🛴 ✏️ 📒 📕 🎨 ✂️ 🎒 🌹 🌷 🪴 👕 🧢 🧦 👟 🧤 🔧 🔨 🪛 🔩".split(" ");
function openEdit(){const draw=()=>{panel(`<h2><span>🛠️ إدارة الرفوف</span><button class="x">✕</button></h2>
  <div class="center" style="font-size:.85rem">${L("اضغط على أيّ منتج لتغييره أو تغيير سعره. 🔥 = عرض","idghat ʿala ayyi muntaj","Tap a product to change it or its price. 🔥 = offer")}</div>
  ${FACES.map((f,fi)=>`<div class="facehd">${f[0]} ${f[1]} <small class="en" style="display:inline">${f[2]}</small></div><div class="grid">${SLOTS.slice(fi*6,fi*6+6).map((s,k)=>`<div class="slot ${s.off?"offer":""}" data-s="${fi*6+k}"><span>${s.e}</span><small>${esc(s.ar)}</small><small>${s.off?"🔥"+ar(s.off):ar(s.p)} ر.س</small></div>`).join("")}</div>`).join("")}
  <div class="opts"><button class="btn" id="reset">↺ إرجاع المنتجات الأصليّة</button></div>`);
  $("pcard").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>editSlot(+b.dataset.s));
  $("reset").onclick=()=>{if(!confirmReset())return;SLOTS=DEF.map(d=>({e:d[0],ar:d[1],tr:d[2],en:d[3],p:d[4],off:0}));save();refreshShelves();draw();};};
  let armed=false;function confirmReset(){if(armed)return true;armed=true;$("reset").textContent="⚠️ اضغط مرّة أخرى للتأكيد";setTimeout(()=>armed=false,3000);return false;}
  draw();window._editDraw=draw;}
function editSlot(si){const s=Object.assign({},SLOTS[si]);let err="";
  const draw=()=>{panel(`<h2><span>✏️ ${s.e} ${esc(s.ar)}</span><button class="x">✕</button></h2>
    <div class="emo">${EMO.map(e=>`<button class="${e===s.e?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
    <div class="row"><b>الاسم:</b><input id="nm" value="${esc(s.ar)}" placeholder="بالعربية أو بحروف إنجليزية"></div>
    <div class="row"><b>English:</b><input id="en" dir="ltr" value="${esc(s.en||"")}" placeholder="e.g. apples"></div>
    <div class="row"><b>السعر:</b><input id="pr" type="number" min="1" value="${s.p}"><b>ر.س</b></div>
    <div class="row"><b>🔥 سعر العرض:</b><input id="of" type="number" min="0" value="${s.off||""}" placeholder="اتركه فارغاً بلا عرض"></div>
    ${err?`<div class="alert">${err}</div>`:""}
    <div class="opts"><button class="btn big green" id="sv">✅ حفظ على الرفّ</button><button class="btn" id="cn">↩️ رجوع</button></div>`);
    $("pcard").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{s.ar=$("nm").value;s.en=$("en").value;s.e=b.dataset.e;draw();});
    $("cn").onclick=()=>openEdit();
    $("sv").onclick=()=>{const nm=$("nm").value.trim(),p=parseInt(String($("pr").value).replace(/[٠-٩]/g,d=>AD.indexOf(d))),of=parseInt(String($("of").value||"0").replace(/[٠-٩]/g,d=>AD.indexOf(d)))||0;
      if(!nm){err="اكتب اسم المنتج ✍️";draw();return;}if(!(p>0)){err="اكتب سعراً أكبر من صفر";draw();return;}if(of&&of>=p){err="سعر العرض يجب أن يكون أقلّ من السعر 🔥";draw();return;}
      const enV=$("en").value.trim();SLOTS[si]={e:s.e,ar:nm,tr:s.tr&&nm===SLOTS[si].ar?s.tr:"",en:nm!==SLOTS[si].ar&&enV===(SLOTS[si].en||"")?"":enV,p,off:of};save();refreshShelves();tone(880,.08);tone(1320,.1,.1);openEdit();};};draw();}

/* ---------- modes ---------- */
function setMode(m){mode=m;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));closeP();
  $("pad").style.display=m==="shop"?"grid":"none";$("help").style.display=m==="shop"?"":"none";
  custSp.visible=false;beltSprites.forEach(s=>scene.remove(s));beltSprites=[];CLOG="";PAY.items=[];PAY.total=0;PAY.status="wait";updPay();
  if(m==="cash")cashStart();if(m==="edit")openEdit();drawSide();setHint("");}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("back").onclick=()=>{location.href="./";};
$("panel").addEventListener("pointerdown",e=>{if(e.target===$("panel")&&mode!=="cash")closeP();});

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
let last=performance.now(),hintT=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);placeCam();renderer.render(scene,cam);if(t-hintT>150){hintT=t;updHint();}requestAnimationFrame(loop);}
newList();setMode("shop");requestAnimationFrame(loop);
window.STORE={THREE,cam,P,SLOTS:()=>SLOTS,CART:()=>CART,setMode,openProduct,startCheckout,CASH,scanBelt,beltSprites:()=>beltSprites,cashAct,PAY};
</script>
</body>
</html>
