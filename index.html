<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>عمارة المصاعد الثلاثة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Lalezar&display=swap">
<style>
/* Layout: one scene like the teacher's board — purple building | three big elevators with displays | receptionist desk — then the story panel, then the cast to pick from. Single committed light look. */
:root{
  color-scheme:light;
  --page:#f7f5ff; --paper:#ffffff; --ink:#2b2547; --soft:#6f6893; --line:#e4def7;
  --bld:#8f7be8; --bld2:#6a58c4; --win:#f6a9c9; --win2:#c7638f;
  --lift:#e8463a; --liftbg:#fff6f5; --metal:#e6e8ef; --orange:#f07a1a;
  --gold:#ffbf2e; --good:#2e9d6a; --bad:#d8433a; --teal:#e6f4f1;
  --display:"Lalezar","Baloo Bhaijaan 2",system-ui,sans-serif;
  --body:"Baloo Bhaijaan 2",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:0;line-height:1}
h2{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0}
.hint{color:var(--soft);font-size:.92rem}
.stars{font-family:var(--display);font-size:1.6rem;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.tog{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:1rem;font-weight:600;cursor:pointer;color:var(--ink);background:var(--paper);
  border:2px solid var(--line);border-radius:12px;padding:6px 14px;line-height:1.3}
button:focus-visible{outline:3px solid var(--bld2);outline-offset:2px}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.big{background:var(--gold);border-color:var(--gold);font-weight:800}
button:disabled{opacity:.45;cursor:default}

.scene{direction:ltr;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:34px 16px 16px 90px;
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.bld{width:250px;flex:none;background:var(--bld);border-radius:6px 6px 0 0;padding:0 12px 0;position:relative;box-shadow:inset 0 -10px 0 var(--bld2)}
.bld::before{content:"";position:absolute;left:-6px;right:-6px;top:-18px;height:18px;background:var(--bld2);border-radius:4px}
.bname{direction:rtl;text-align:center;color:#fff;font-family:var(--display);font-size:1.05rem;padding:4px 0 2px}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:7px 0;position:relative}
.frow.here{background:rgba(255,255,255,.22);border-radius:8px}
.flabel{position:absolute;right:calc(100% + 16px);top:50%;transform:translateY(-50%);direction:rtl;white-space:nowrap;font-size:.72rem;color:var(--soft);font-weight:800}
.wnd{height:42px;border-radius:3px;background:var(--win);border:3px solid #fff;box-shadow:0 4px 0 var(--bld2);position:relative;
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--win2);padding:0;cursor:default;font-family:var(--body)}
.wnd::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:.7}
.wnd span{position:relative;z-index:1;font-size:1.5rem;line-height:1}
.wnd.pick{cursor:pointer;outline:3px dashed var(--gold);outline-offset:2px}
.wnd.lit{background:#fff7d6}
.wnd.lit::after{display:none}
.entrance{background:var(--lift);border:3px solid #fff;height:52px;border-radius:3px 3px 0 0;display:flex;align-items:flex-end;justify-content:center;font-size:1.6rem}
.street{height:10px;background:var(--bld2);margin:0 -12px}

.lifts{display:flex;align-items:flex-end;gap:10px;flex:1;justify-content:center;min-width:0}
.lift{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:0;border-radius:6px}
.arrows{height:30px;font-size:1.4rem;color:var(--lift);font-weight:800;letter-spacing:4px}
.arrows.go{animation:up .6s infinite}
.arrows.down{rotate:180deg}
@keyframes up{0%,100%{transform:translateY(4px)}50%{transform:translateY(-4px)}}
.disp{min-width:60px;border:2px solid var(--lift);color:var(--lift);font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:1rem;padding:0 8px;border-radius:3px;background:#fff;text-align:center}
.box{width:104px;height:200px;border:2px solid var(--lift);background:var(--liftbg);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.box .who{font-size:4.2rem;line-height:1;padding-bottom:8px}
.box .l,.box .r{position:absolute;top:0;bottom:0;width:50%;background:var(--metal);border:1px solid #c8ccd8;transition:transform .55s}
.box .l{left:0}.box .r{right:0}
.lift.open .l{transform:translateX(-100%)}.lift.open .r{transform:translateX(100%)}
.box .tape{position:absolute;left:-10px;right:-10px;top:45%;height:16px;background:repeating-linear-gradient(45deg,#ffd23f 0 9px,#222 9px 18px);transform:rotate(-8deg);z-index:3}
.box .warn{position:absolute;top:18%;left:6px;right:6px;z-index:3;background:#fff;color:var(--bad);border:2px solid var(--bad);border-radius:4px;font-size:.7rem;font-weight:800;direction:rtl;text-align:center;padding:2px}
.lname{direction:rtl;font-size:.85rem;font-weight:800;color:var(--soft);font-family:var(--body)}
.call{align-self:center;border:2px solid var(--orange);color:var(--orange);font-size:.9rem;padding:0 6px;border-radius:3px;margin-bottom:60px}
.lift.chosen .box{border-width:4px;box-shadow:0 0 0 4px #ffe1dc}
.stuck .box{animation:shake .25s 6}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.desk{flex:none;display:flex;flex-direction:column;align-items:center;width:160px}
.desk .person{font-size:4.4rem;line-height:1;margin-bottom:-14px;position:relative}
.desk .pc{position:absolute;right:-30px;bottom:6px;font-size:1.8rem}
.desk .table{width:150px;height:56px;background:#4a5068;border-radius:10px 10px 4px 4px;box-shadow:inset 0 10px 0 #a08a75;color:#fff;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-weight:800;direction:rtl;font-size:.9rem}
.desk .bub{direction:rtl;background:var(--teal);border-radius:12px;padding:2px 10px;font-size:.85rem;font-weight:800;margin-bottom:8px}
.desk.talking .bub{background:var(--gold)}
@media (max-width:820px){.scene{justify-content:center;padding-left:16px}.bld{order:2;margin-left:74px}.lifts{order:1;flex-basis:100%}.desk{order:3}}
@media (max-width:420px){.box{width:78px;height:160px}.box .who{font-size:3.2rem}.call{display:none}.lifts{gap:6px}.bld{width:210px;margin-left:66px}.frow{gap:7px}}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{font-size:3rem;line-height:1;background:var(--page);border-radius:16px;padding:6px 10px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--page);color:var(--soft)}
.steps span.on{background:var(--ink);color:var(--paper)}
.talk{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:#f1edff;border-radius:14px;padding:8px 10px}
.ln.them{background:var(--teal)}
.spk{font-size:.75rem;font-weight:800;color:var(--soft);text-align:center;min-width:56px}
.spk b{display:block;font-size:1.5rem;line-height:1}
.ar{font-size:1.2rem;font-weight:800;line-height:1.45;text-wrap:balance}
.tr{direction:ltr;text-align:left;color:var(--soft);font-size:.88rem}
.en{direction:ltr;text-align:left;color:#2e7d6f;font-size:.85rem}
.ok{padding:4px 10px;font-size:.9rem}
.ok.done{background:var(--good);color:#fff;border-color:var(--good)}
.blank{border-bottom:3px dotted var(--ink);padding:0 18px}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,62px);gap:8px;justify-content:center;background:var(--metal);padding:12px;border-radius:14px;width:max-content;margin:0 auto}
.keypad.one{grid-template-columns:62px}
.keypad button{border-radius:50%;width:62px;height:62px;font-size:1.4rem;font-weight:800;background:#f7f8fb;border:3px solid #b8bfcc;padding:0}
.keypad button.req{background:#ffe08a;border-color:#f2b705;color:#7a5600;box-shadow:0 0 10px rgba(242,183,5,.7)}
.nbmsg{text-align:center}
.box .who{display:flex;justify-content:center;align-items:flex-end}.box .who:has(.fig+.fig) .fig{zoom:.78}.box .who:has(.fig+.fig+.fig) .fig{zoom:.58}
.keypad button.cancelled{opacity:.35;text-decoration:line-through}
.cancelfl{background:#fde7e7;border-color:#e57373;color:#b71c1c}
.keypad .alarm{background:var(--bad);color:#fff;border-color:#a2302a}
.dir{border:2px dashed var(--soft);border-radius:12px;padding:10px;display:grid;gap:6px;overflow-x:auto}
.dir table{border-collapse:collapse;font-size:.85rem;width:100%}
.dir td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.dir .target{font-weight:800;background:#fff7d6;border-radius:8px;padding:4px 8px}
.alert{background:#fde3e0;color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:800}
.win{background:#dff5ea;color:var(--good);border-radius:12px;padding:8px 12px;font-weight:800}
.challenge{border:2px solid var(--gold);border-radius:12px;padding:8px 12px}

.cast{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}
.actor{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;min-width:76px;border-radius:14px}
.actor b{font-size:2.6rem;line-height:1}
.actor span{font-size:.8rem}
.actor.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* ADHD-friendly focus: one line at a time, big targets, quick rewards */
.focus{position:relative}
.lifts.focus .lift .box,.bld.focus,.desk.focus .person{filter:drop-shadow(0 0 10px rgba(255,191,46,.9))}
.lift.pulse .box{animation:glow 1s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(232,70,58,.5)}50%{box-shadow:0 0 0 10px rgba(232,70,58,0)}}
.pulse.alarm{animation:glow 1s infinite}
.mission{font-size:1.25rem;font-weight:800}
.steps span.done{background:#dff5ea;color:var(--good)}
.past{display:grid;gap:4px}
.pb{font-size:.9rem;color:var(--soft);background:var(--page);border-radius:10px;padding:2px 10px;opacity:.75;justify-self:start;max-width:100%}
.pb.me{justify-self:end}
.pb b{font-size:1.1rem}
.now{border-radius:20px;padding:16px;display:grid;gap:8px;justify-items:center;text-align:center;border:3px solid var(--line);animation:inpop .3s}
.now.me{background:#fff7d6;border-color:var(--gold)}
.now.them{background:var(--teal);border-color:#b9e2da}
@keyframes inpop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
.nowwho{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--soft)}
.nowwho b{font-size:2.4rem;line-height:1}
.ar.big{font-size:1.9rem;line-height:1.5}
.now .tr,.now .en{text-align:center}
.say{font-size:1.25rem;font-weight:800;background:var(--good);color:#fff;border-color:var(--good);padding:10px 28px;border-radius:16px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--good)} .dots i.c{background:var(--gold);transform:scale(1.3)}
.center{justify-content:center;text-align:center}
.huge{font-size:1.3rem;padding:10px 26px}
.small{font-size:.85rem;padding:4px 10px;opacity:.8}
.finish{display:grid;gap:10px;justify-items:center;text-align:center;padding:10px;border-radius:20px;background:#fff7d6}
.bigstar{font-size:4rem;line-height:1;animation:spin 1s}
@keyframes spin{from{transform:rotate(-180deg) scale(.3)}to{transform:none}}
.shake{animation:shake .3s 4}
.stars.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.35)}}
.shelfbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 12px}
.meter{width:140px;height:14px;border-radius:999px;background:var(--page);overflow:hidden;border:2px solid var(--line)}
.meter div{height:100%;background:var(--gold);transition:width .4s}
.shelf{font-size:1.6rem;letter-spacing:4px;min-width:0;overflow-wrap:anywhere}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.cf{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;rotate:540deg}}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(43,37,71,.45);padding:16px}
.popin{background:var(--paper);border-radius:24px;padding:20px 34px;display:grid;justify-items:center;animation:inpop .3s;font-weight:800;font-size:1.3rem}
.popin b{font-size:5rem;line-height:1.1}
.brkcard{background:var(--paper);border-radius:24px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;max-width:420px;width:100%;animation:inpop .3s}
.brkt{font-family:var(--display);font-size:1.6rem}
.ring{width:84px;height:84px;border-radius:50%;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.2rem}

/* 19 floors: compact building and keypad */
.frow{gap:8px;padding:5px 6px;margin:0 -6px;border-bottom:3px solid var(--bld2)}
.frow:nth-child(odd){background:rgba(255,255,255,.08)}
.wnd{height:34px;border-width:2px;box-shadow:none;font-size:.8rem;color:#7a2d52;background:#ffd0e3}
.wnd span{font-size:1.4rem}
.entrance{height:40px;font-size:1.5rem}
.flabel{right:calc(100% + 12px);font-size:.95rem;font-weight:800;color:#fff;background:var(--bld2);min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;font-variant-numeric:tabular-nums}
.frow.here .flabel{background:var(--gold);color:var(--ink)}
.frow.here{background:rgba(255,191,46,.45)}
.bld{width:320px}
.box{height:240px}
.keypad{grid-template-columns:repeat(4,50px)}
.keypad button{width:50px;height:50px;font-size:1.1rem}
.dir{max-height:300px;overflow:auto}
.call{cursor:pointer;background:#fff;font-family:inherit;font-weight:800;font-size:1.1rem;padding:2px 8px;line-height:1.2;transition:transform .1s}
.call:hover{background:#fff1e6}
.call:active{transform:scale(.9)}
.call.lit{background:var(--orange);color:#fff;box-shadow:0 0 12px var(--orange)}
.actor:first-child{border-color:var(--gold)}
@media (max-width:420px){.bld{width:250px}.wnd{font-size:.68rem;height:30px}.frow{gap:5px}.box{height:180px}}

/* power break */
.brkcard.power{background:#1d1838;color:#fff;border:3px solid var(--gold)}
.brkcard.power .tr{color:#c9c2ea}
.brkcard.power.win{background:#123d2c;border-color:var(--good)}
.batt{position:relative;width:min(300px,80vw);height:46px;border:4px solid #fff;border-radius:10px;padding:4px;margin-inline-end:10px}
.batt::after{content:"";position:absolute;right:-12px;top:12px;width:8px;height:14px;background:#fff;border-radius:0 3px 3px 0}
[dir=rtl] .batt::after{right:auto;left:-12px;border-radius:3px 0 0 3px}
.bfill{height:100%;border-radius:4px;background:var(--bad);transition:width .12s}
.bfill.mid{background:var(--gold)}.bfill.hi{background:#4fd18b}
.batt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;text-shadow:0 1px 3px #000}
.count{font-family:var(--display);font-size:3.4rem;line-height:1;display:grid;justify-items:center}
.count small{font-family:var(--body);font-size:1rem;color:var(--gold)}
.zap{font-size:1.8rem;font-weight:800;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--gold) 55%,#d99a00);
  border:6px solid #fff;color:#3a2a00;box-shadow:0 8px 0 #a57400,0 0 30px rgba(255,191,46,.6);user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.zap:active{transform:translateY(6px);box-shadow:0 2px 0 #a57400}
.zap.hit{animation:zhit .15s}
@keyframes zhit{50%{transform:scale(.92)}}
.clock{font-weight:800;font-size:1.2rem}
.clock.warn{color:#ff8a80;animation:bump .5s infinite}
.bigbolt{font-size:3.6rem}

/* pronunciation under words */
.pa{display:inline}
.furnrow{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;vertical-align:middle;margin-inline-start:4px;font-size:1.15em}
.pw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle}
.pr{direction:ltr;font-size:.62em;font-weight:500;opacity:.85;font-family:var(--body);letter-spacing:0}
.desk .table{height:auto;min-height:56px;padding-top:14px}
.bname .pr{opacity:.9}

.call.pulse{animation:callglow 1s infinite}
@keyframes callglow{0%,100%{box-shadow:0 0 0 0 rgba(240,122,26,.7)}50%{box-shadow:0 0 0 10px rgba(240,122,26,0)}}
.callbig{background:#fff;color:var(--orange);border:3px solid var(--orange);animation:callglow 1s infinite}

/* green arrival light */
.lamp{width:34px;height:12px;border-radius:999px;background:#c9ccd6;border:2px solid #9aa0b0;transition:background .2s,box-shadow .2s}
.lamp.on{background:#2ecc71;border-color:#1e9e55;box-shadow:0 0 14px 4px rgba(46,204,113,.75);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{background:#c9ccd6;border-color:#9aa0b0;box-shadow:none}}
.lift.open .box{animation:boxblink 1.4s ease-in-out infinite}
@keyframes boxblink{50%{box-shadow:0 0 4px rgba(46,204,113,.2)}}
.lift.open .box{border-color:#2ecc71;box-shadow:0 0 18px rgba(46,204,113,.55)}
.lift.open .disp{border-color:#2ecc71;color:#1e9e55}
/* characters with bodies */
.fig{display:inline-flex;flex-direction:column;align-items:center;position:relative;vertical-align:bottom}
.fig .head{font-size:2.5rem;line-height:1;position:relative;z-index:2}
.fig .torso{width:30px;height:34px;background:var(--shirt);border-radius:12px 12px 6px 6px;margin-top:-5px;position:relative}
.fig .torso::before,.fig .torso::after{content:"";position:absolute;top:3px;width:8px;height:28px;background:var(--shirt);border-radius:4px;filter:brightness(.85);transform-origin:top center}
.fig .torso::before{left:-8px}.fig .torso::after{right:-8px}
.fig .legs{display:flex;gap:4px;margin-top:-2px}
.fig .legs i{width:10px;height:26px;background:#3b3355;border-radius:4px 4px 5px 5px;transform-origin:top center}
.fig.walk .legs i:first-child,.fig.walk .torso::after{animation:swingA .3s infinite alternate}
.fig.walk .legs i:last-child,.fig.walk .torso::before{animation:swingB .3s infinite alternate}
@keyframes swingA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes swingB{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.fig.walkin{animation:walkin 1.3s ease-out forwards}
@keyframes walkin{from{transform:translateX(150%)}to{transform:translateX(0)}}
.fig.walkout{animation:walkout 1.4s ease-in forwards}
@keyframes walkout{from{transform:translateX(0)}to{transform:translateX(-170%)}}
.fig:not(.walk) .head{animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.fig.small{transform:scale(.55);transform-origin:bottom center;margin-bottom:-2px}
.entrance{overflow:visible;align-items:flex-end}
.box .who{font-size:1rem;padding-bottom:4px}
/* spoken announcement caption */
.ann{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:40;background:#1d1838;color:#fff;border:2px solid #2ecc71;
  border-radius:16px;padding:8px 18px;font-weight:800;font-size:1.15rem;display:grid;justify-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.ann small{direction:ltr;font-weight:500;font-size:.8rem;color:#bfe9d0}

  do{S.t=1+Math.floor(Math.random()*TOP);S.side=Math.floor(Math.random()*4);}while(S.res[S.t][S.side].home);S.why=rnd(WHY);

/* ---------- brain break ---------- */
let brkT=null;
const NEED=20, SECS=10;
function brainBreak(){
  const o=$("brk");let n=0,left=SECS,state="ready";
  clearInterval(brkT);
  const NUM=["صفر","واحد","اثنان","ثلاثة","أربعة","خمسة","ستّة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستّة عشر","سبعة عشر","ثمانية عشر","تسعة عشر","عشرون"];
  const draw=()=>{
    const pct=Math.min(100,n/NEED*100);
    let body="";
    if(state==="ready"||state==="go"){
      body=`<div class="brkt">⚡ انقطعت الكهرباء!</div>
        <div class="ar" style="font-size:1.4rem">المصعد متوقّف. اشحن البطارية بسرعة!</div>
        ${S.tr?`<div class="tr" style="text-align:center">inqataʿat al-kahraba'! ishhan al-battariyya bi-surʿa!</div>`:""}
        <div class="batt"><div class="bfill ${pct>=70?"hi":pct>=35?"mid":""}" style="width:${pct}%"></div><span>${ar(Math.round(pct))}٪</span></div>
        <div class="count">${ar(n)}<small>${n?NUM[Math.min(n,20)]:"اضغط ٢٠ مرّة"}</small></div>
        <button class="zap" id="zap">⚡ اشحن!</button>
        <div class="clock ${left<=3&&state==="go"?"warn":""}">⏱️ ${ar(left)} ثوانٍ</div>`;
    } else if(state==="win"){
      body=`<div class="brkt">✅ تمّ الشحن!</div><div class="bigbolt">⚡🛗⚡</div>
        <div class="ar" style="font-size:1.6rem">قُل: «المصعد يعمل الآن!»</div>
        ${S.tr?`<div class="tr" style="text-align:center">al-misʿad yaʿmalu al-an!</div>`:""}
        <button class="big huge" id="brkDone">قالها! +⭐ ➜</button>`;
    } else {
      body=`<div class="brkt">🔋 البطارية ما زالت ضعيفة!</div>
        <div class="ar" style="font-size:1.4rem">شحنتَ ${ar(n)} مرّة. هل تحاول مرّة أخرى؟</div>
        <div class="tog center"><button class="big huge" id="retry">🔄 حاول مرّة أخرى</button><button id="skip">تخطَّ</button></div>`;
    }
    o.innerHTML=`<div class="brkcard power ${state}">${body}</div>`;
    const z=$("zap");
    if(z){z.onclick=press;z.focus({preventScroll:true});}
    const d=$("brkDone");if(d)d.onclick=()=>{close();addStars(1);yay();render();};
    const r=$("retry");if(r)r.onclick=()=>{n=0;left=SECS;state="ready";draw();};
    const sk=$("skip");if(sk)sk.onclick=()=>{close();render();};
  };
  const press=()=>{
    if(state==="ready"){state="go";brkT=setInterval(()=>{left--;if(left<=0){clearInterval(brkT);left=0;if(state==="go"){state="lose";alarm();}}draw();},1000);}
    if(state!=="go")return;
    n++;tone(300+n*35,.08,0,"square",.06);
    const b=document.querySelector(".zap");
    if(n>=NEED){state="win";clearInterval(brkT);ding();setTimeout(yay,300);confetti(70);}
    draw();
    if(state==="go"){const z=$("zap");z.classList.remove("hit");void z.offsetWidth;z.classList.add("hit");}
  };
  const close=()=>{clearInterval(brkT);o.hidden=true;document.removeEventListener("keydown",key);};
  const key=e=>{if((e.code==="Space"||e.code==="Enter")&&(state==="ready"||state==="go")){e.preventDefault();press();}};
  document.addEventListener("keydown",key);
  o.hidden=false;draw();
}

    $("scene").innerHTML=souqScene();

    return;
  }
  if(S.phase==="place"){
    $("scene").innerHTML=placeScene();
    $("scene").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>playPlace(b.dataset.pk));
    return;
  }
  if(S.phase==="house"){
    $("scene").innerHTML=houseScene();
    $("scene").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>playPark(b.dataset.pk));
    return;
  }

/* ---------- WhatsApp-style chat between Ibraheem and Bayan ----------
   Every device keeps the conversation in its own browser.
   When the other player has the game open too (room capability), each page
   shares its latest outgoing messages through presence and the other page
   files them into its own copy. */
let CHAT=[];try{const c=JSON.parse(localStorage.getItem("tower-chat-v1")||"[]");if(Array.isArray(c))CHAT=c;}catch(e){}
CHAT.forEach(m=>{if(!m.id)m.id=m.ts+"-"+m.from;if(!m.from&&m.by)m.from=m.by;});
function saveChat(){try{localStorage.setItem("tower-chat-v1",JSON.stringify(CHAT.slice(-400)));}catch(e){}}
const REQ_TAG="§REQ§",ACC_TAG="§ACC§",DEN_TAG="§DEN§",CAN_TAG="§CAN§",IMG_TAG="§IMG§";
const CLR_TAG="§CLR§";
const isCtl=m=>typeof m.text==="string"&&/^§(REQ|ACC|DEN|CAN|CLR)§/.test(m.text);
const DEL_TAG="§DEL§",isDel=m=>m.text===DEL_TAG;
const AUD_TAG="§AUD§",isAud=m=>typeof m.text==="string"&&m.text.startsWith(AUD_TAG);
const isImg=m=>typeof m.text==="string"&&m.text.startsWith(IMG_TAG);
// chat limit: none (no cap on lines or characters)
const MSG_LINES=Infinity,MSG_CHARS=Infinity;
function fitMsg(t){t=String(t);const L=t.split("\n");if(L.length>MSG_LINES)t=L.slice(0,MSG_LINES).join("\n");return t.slice(0,MSG_CHARS);}
const tooLong=t=>String(t).split("\n").length>MSG_LINES;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lastSeen=()=>{try{return +localStorage.getItem("tower-seen-"+CUR)||0;}catch(e){return 0;}};
function markSeen(){try{localStorage.setItem("tower-seen-"+CUR,String(Date.now()));}catch(e){}}
const pair=m=>(m.from===CUR&&m.to===other())||(m.from===other()&&m.to===CUR);
const unread=()=>{const t=lastSeen();return CHAT.filter(m=>m.to===CUR&&m.from===other()&&m.ts>t&&!isCtl(m)&&!isEndMsg(m)&&!isDel(m)).length;};
const hhmm=ts=>{const d=new Date(ts);return ar(String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"));};
const bubble=m=>{if(typeof m.text==="string"&&m.text.startsWith("§END§"))return `<div class="msg endmsg">👋 ${P("انتهت الزيارة. هديّة لشقّة كلّ واحد منكما! 🎁","intahat al-ziyara.")}<div class="mtime">${hhmm(m.ts)}</div></div>`;const p=PL_INFO[m.from]||PL_INFO.ib;if(isDel(m)){const p0=PL_INFO[m.from]||PL_INFO.ib;return `<div class="msg ${m.from===CUR?"mine":"theirs"} deleted"><div class="mhead">${p0.e} ${p0.name}</div><div class="mtext">🚫 ${P("حُذِفت هذه الرسالة","hudhifat hadhihi al-risala")}</div><div class="mtime">${hhmm(m.ts)}</div></div>`;}
  const mine=m.from===CUR,aud=isAud(m),img=isImg(m)||aud,url=aud?m.text.slice(AUD_TAG.length):img?m.text.slice(IMG_TAG.length):"";const okUrl=/^https:\/\/[a-z0-9.-]+\.supabase\.co\//i.test(url);return `<div class="msg ${mine?"mine":"theirs"} ${CHT.editId===m.id?"editing":""}"><div class="mhead">${p.e} ${p.name}${mine&&!img?`<button class="medit" data-edit="${esc(m.id)}" title="تعديل">✏️</button>`:""}${mine?`<button class="medit mdel ${CHT.delArm===m.id?"armed":""}" data-del="${esc(m.id)}" title="حذف">${CHT.delArm===m.id?`🗑️ ${P("احذف؟","ihdhif?")}`:"🗑️"}</button>`:""}</div>${aud?(okUrl?`<div class="maud">🎤 <audio controls preload="metadata" src="${esc(url)}"></audio></div>`:`<div class="mtext">🎤</div>`):img?(okUrl?`<a href="${esc(url)}" target="_blank" rel="noopener"><img class="mimg" src="${esc(url)}" alt="صورة" loading="lazy"></a>`:`<div class="mtext">🖼️</div>`):`<div class="mtext">${esc(m.text)}</div>`}<div class="mtime">${m.edited?`<span class="medited">${P("معدّلة","muʿaddala")}</span> `:""}${hhmm(m.ts)}<button class="mreact" data-rbtn="${esc(m.id)}" title="تفاعل">😊+</button></div>${CHT.reactFor===m.id?`<div class="rbar">${REACTS.map(e=>`<button data-react="${esc(m.id)}|${e}" class="${cleanReacts(m.reacts)[CUR]===e?"on":""}">${e}</button>`).join("")}</div>`:""}${(()=>{const r=cleanReacts(m.reacts),ks=Object.keys(r);return ks.length?`<div class="mreacts">${ks.map(k=>`<span title="${PL_INFO[k].name}">${r[k]}<small>${PL_INFO[k].e}</small></span>`).join("")}</div>`:"";})()}</div>`;};
function ingest(m){
  if(!m||typeof m.text!=="string"||typeof m.ts!=="number"||typeof m.id!=="string")return false;
  if(!PL_INFO[m.from]||!PL_INFO[m.to]||m.from===m.to)return false;
  if(CHAT.some(x=>x.id===m.id))return false;
  CHAT.push({id:m.id.slice(0,40),from:m.from,to:m.to,text:m.text.slice(0,MSG_CHARS),ts:m.ts,edited:!!m.edited,reacts:cleanReacts(m.reacts)});
  return true;
}
function sendChat(text,from=CUR){
  const msg={id:newId(),from,to:from==="ib"?"by":"ib",text:fitMsg(String(text)),ts:Date.now()};
  CHAT.push(msg);saveChat();
  if(SB)SB.from("tower_messages").insert({id:msg.id,from_pl:msg.from,to_pl:msg.to,body:msg.text,ts:msg.ts}).then(()=>{});
  return msg;
}

const SB_URL=(window.TOWER_CFG&&window.TOWER_CFG.url)||"", SB_KEY=(window.TOWER_CFG&&window.TOWER_CFG.key)||"";
let SB=null,sbOn=false,onlineNow=new Set(),presCh=null,typCh=null;
const TYP={until:0,sent:0,t:null};
function typingNow(){return Date.now()<TYP.until;}

  if(on&&now-TYP.sent<1500)return;TYP.sent=on?now:0;
  typCh.send({type:"broadcast",event:"typing",payload:{pl:CUR,on}}).catch(()=>{});

const TAB=Math.random().toString(36).slice(2,10);
const otherHere=()=>onlineNow.has(other());
const rowToMsg=r=>({id:r.id,from:r.from_pl,to:r.to_pl,text:r.body,ts:Number(r.ts),edited:!!r.edited,reacts:r.reacts});
const REACTS=["❤️","👍","😂","😮","😢","🤲","⭐"];
function cleanReacts(r){const o={};if(r&&typeof r==="object")for(const k of ["ib","by"])if(REACTS.includes(r[k]))o[k]=r[k];return o;}
function applyEdit(m){const x=CHAT.find(y=>y.id===m.id);if(!x||typeof m.text!=="string")return false;const rc=cleanReacts(m.reacts);
  if(x.text===m.text&&!!x.edited===!!m.edited&&JSON.stringify(cleanReacts(x.reacts))===JSON.stringify(rc))return false;
  x.text=m.text.slice(0,MSG_CHARS);x.edited=!!m.edited;x.reacts=rc;return true;}
function reactTo(id,e){
  const x=CHAT.find(y=>y.id===id);if(!x||isDel(x))return;
  const r=cleanReacts(x.reacts);if(r[CUR]===e)delete r[CUR];else r[CUR]=e;x.reacts=r;saveChat();
  if(SB)SB.from("tower_messages").update({reacts:r}).eq("id",id).then(()=>{});
}
function deleteChat(id){
  const x=CHAT.find(y=>y.id===id);if(!x||x.from!==CUR||isDel(x))return;
  x.text=DEL_TAG;x.edited=false;saveChat();
  if(SB)SB.from("tower_messages").update({body:DEL_TAG,edited:false}).eq("id",id).eq("from_pl",CUR).then(()=>{});
}
function editChat(id,text){
  const x=CHAT.find(y=>y.id===id);if(!x||x.from!==CUR||isEndMsg(x)||isCtl(x)||isImg(x)||isAud(x)||isDel(x))return;
  text=fitMsg(String(text).trim());if(!text||text===x.text)return;
  x.text=text;x.edited=true;saveChat();
  if(SB)SB.from("tower_messages").update({body:text,edited:true}).eq("id",id).eq("from_pl",CUR).then(()=>{});
}
function notifyFresh(fresh){
  if(fresh.some(m=>m.from===other())){TYP.until=0;showTyping();}
  const toMe=fresh.filter(m=>m.to===CUR&&!isCtl(m));
  if(!toMe.length)return;
  if(CHT.open)markSeen();
  else{tone(880,.12);tone(1180,.15,.12);pop("💬",`رسالة جديدة من ${PL_INFO[toMe[toMe.length-1].from].name}!`);}
}

let pTimer=null;
function syncPlayer(){
  if(!SB)return;clearTimeout(pTimer);
  const k=CUR,data=JSON.parse(JSON.stringify(PL[k]));
  pTimer=setTimeout(()=>{SB.from("tower_players").upsert({id:k,data,updated_at:new Date().toISOString()}).then(()=>{});},700);
}
(async()=>{
  try{
    if(!SB_URL.startsWith("https://")||!window.supabase)return;
    SB=window.supabase.createClient(SB_URL,SB_KEY);
    // players' progress
    const pr=await SB.from("tower_players").select("*");
    if(!pr.error&&pr.data){
      for(const row of pr.data){if(PL[row.id]&&row.data&&row.data.home){PL[row.id]=Object.assign(PL[row.id],row.data);if(!Array.isArray(PL[row.id].opts))PL[row.id].opts=[];}}
      HOME=PL[CUR].home;S.stars=PL[CUR].stars||0;S.detOn=PL[CUR].cfg?PL[CUR].cfg.det!==false:true;
      try{localStorage.setItem("tower-players-v1",JSON.stringify(PL));}catch(e){}
      layout();render();
      setTimeout(()=>{if(typeof runStreak==="function")runStreak();},800);
    }
    // message history
    const mr=await SB.from("tower_messages").select("*").order("ts",{ascending:false}).limit(300);
    if(!mr.error&&mr.data){
      const fresh=[];mr.data.reverse().forEach(r=>{const m=rowToMsg(r);if(ingest(m))fresh.push(m);else applyEdit(m);});
      CHAT.sort((a,b)=>a.ts-b.ts);saveChat();claimGifts();handleCtl();
      // push anything this device wrote while offline
      const known=new Set(mr.data.map(r=>r.id));
      const pending=CHAT.filter(m=>!known.has(m.id)&&m.ts>Date.now()-7*864e5);
      if(pending.length)SB.from("tower_messages").upsert(pending.map(m=>({id:m.id,from_pl:m.from,to_pl:m.to,body:m.text,ts:m.ts})),{onConflict:"id",ignoreDuplicates:true}).then(()=>{});
      sbOn=true;render();
    }
    // live: new messages + other player's progress
    SB.channel("tower-db")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"tower_messages"},p=>{
        const m=rowToMsg(p.new);if(ingest(m)){CHAT.sort((a,b)=>a.ts-b.ts);saveChat();if(isEndMsg(m))claimGifts();else if(isCtl(m))handleCtl();else notifyFresh([m]);if(CHT.open)drawChat();render();}})
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"tower_messages"},p=>{
        const m=rowToMsg(p.new);if(applyEdit(m)){saveChat();if(CHT.open&&!CHT.editId){CHT.keepScroll=true;drawChat();}render();}})
      .on("postgres_changes",{event:"*",schema:"public",table:"tower_players"},p=>{
        const row=p.new;if(!row||!PL[row.id]||row.id===CUR||!row.data||!row.data.home)return;
        PL[row.id]=Object.assign(PL[row.id],row.data);layout();render();})
      .subscribe();
    // who is online now
    typCh=SB.channel("tower-typing",{config:{broadcast:{self:false}}})
      .on("broadcast",{event:"typing"},({payload:p})=>{if(!p||p.pl!==other())return;TYP.until=p.on?Date.now()+3500:0;showTyping();})
      .subscribe();
    presCh=SB.channel("tower-online",{config:{presence:{key:TAB}}});
    presCh.on("presence",{event:"sync"},()=>{
      const st=presCh.presenceState();onlineNow=new Set();
      for(const [key,arr] of Object.entries(st))if(key!==TAB)arr.forEach(x=>x&&x.pl&&onlineNow.add(x.pl));
      if(CHT.open)drawChat();render();
    }).subscribe(s=>{if(s==="SUBSCRIBED")pushPresence();});
  }catch(e){console.warn("supabase",e);}
})();

async function shrinkPic(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url;});
    const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,"image/jpeg",.82));
  }finally{URL.revokeObjectURL(url);}
}

async function startRec(){
  if(!SB){pop("⚠️","الرسائل الصوتية تحتاج إلى اتصال بالإنترنت.");return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){pop("⚠️","هذا المتصفّح لا يدعم التسجيل.");return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){pop("🎤","اسمح للعبة باستخدام الميكروفون لتسجّل رسالة.");return;}
  const type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined),chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  CHT.rec={mr,chunks,stream,start:Date.now(),timer:setInterval(tickRec,250)};
  mr.start();sendTyping(true);beep();drawChat();
}
function stopRec(send){
  const r=CHT.rec;if(!r)return;CHT.rec=null;clearInterval(r.timer);
  r.mr.onstop=()=>{r.stream.getTracks().forEach(t=>t.stop());
    if(send&&r.chunks.length){const base=(r.mr.mimeType||r.chunks[0].type||"audio/webm").split(";")[0];sendAudio(new Blob(r.chunks,{type:base}),base);}
    else drawChat();};
  try{r.mr.stop();}catch(e){r.mr.onstop();}
  sendTyping(false);drawChat();
}
async function sendAudio(blob,type){
  CHT.uploading="aud";drawChat();
  try{
    const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":type.includes("mpeg")?"mp3":"webm";
    const path=`${CUR}/voice-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await SB.storage.from("tower-pics").upload(path,blob,{contentType:type,upsert:false});
    if(up.error)throw up.error;
    sendChat(AUD_TAG+SB.storage.from("tower-pics").getPublicUrl(path).data.publicUrl);addStars(1);beep();markSeen();
  }catch(e){pop("⚠️","تعذّر إرسال الرسالة الصوتية، حاول مرّة أخرى.");}
  CHT.uploading=false;drawChat();render();
}
async function sendPic(file){
  if(!/^image\//.test(file.type)){pop("⚠️","هذا ليس ملفّ صورة.");return;}
  if(!SB){pop("⚠️","إرسال الصور يحتاج إلى اتصال بالإنترنت.");return;}
  CHT.uploading=true;drawChat();
  try{
    const blob=await shrinkPic(file);
    const path=`${CUR}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up=await SB.storage.from("tower-pics").upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(up.error)throw up.error;
    const pub=SB.storage.from("tower-pics").getPublicUrl(path).data.publicUrl;
    sendChat(IMG_TAG+pub);addStars(1);beep();markSeen();
  }catch(e){pop("⚠️","تعذّر إرسال الصورة، حاول مرّة أخرى.");}
  CHT.uploading=false;drawChat();render();
}
const KNOCK_TTL=15*60*1000;let KNOCK=null;
function answered(id){return CHAT.some(m=>typeof m.text==="string"&&(m.text===ACC_TAG+id||m.text===DEN_TAG+id||m.text===CAN_TAG+id));}
function applyClear(){
  const c=CHAT.filter(m=>m.text===CLR_TAG).reduce((a,m)=>Math.max(a,m.ts),0);
  if(!c)return false;const n=CHAT.length;CHAT=CHAT.filter(m=>m.ts>=c);
  if(CHAT.length!==n){saveChat();return true;}return false;
}
function clearChat(){
  const m=sendChat(CLR_TAG);applyClear();
  if(SB)SB.from("tower_messages").delete().lt("ts",m.ts).then(()=>{});
  CHT.menu=false;CHT.clrArm=false;CHT.editId=null;CHT.draft="";drawChat();render();
  pop("🧹","تمّ مسح المحادثة عند الاثنين.");
}
function handleCtl(){
  if(applyClear()&&CHT.open)drawChat();
  // replies to my request
  const kr=S.knockReq;
  if(kr&&kr.st==="wait"){
    if(CHAT.some(m=>m.to===CUR&&m.text===ACC_TAG+kr.id)){kr.st="ok";yay();pop("🚪",`${PL_INFO[other()].name}: تفضّل، ادخل!`);render();}
    else if(CHAT.some(m=>m.to===CUR&&m.text===DEN_TAG+kr.id)){kr.st="no";tone(300,.2);render();}
  }
  // someone knocking on my door
  const req=CHAT.filter(m=>m.to===CUR&&m.text===REQ_TAG&&Date.now()-m.ts<KNOCK_TTL&&!answered(m.id)).pop();
  if(req&&(!KNOCK||KNOCK.id!==req.id)){KNOCK=req;knock();drawKnock();}
  else if(!req&&KNOCK){KNOCK=null;drawKnock();}
}

const QT={above:["فوق","fawqa","above"],below:["تحت","tahta","below"],on:["في","fi","on"]};
function newDet(){return {cand:[false,...Array(TOP).fill(true)],log:[],n:0,type:"above",x:10,done:false};}

function detQ(){const t=T(),d=S.det,q=QT[d.type];
  return {ar:`هل ${G(t,"يسكن","تسكن")} ${q[0]} ${FL[d.x].ar}؟`,tr:`hal ${G(t,"yaskunu","taskunu")} ${q[1]} ${FL[d.x].tr}?`,en:`Does ${G(t,"he","she")} live ${q[2]} the ${FL[d.x].en}?`};}

  const d=S.det,t=T(),x=d.x,q=QT[d.type],Q=detQ();

  for(let f=1;f<=TOP;f++){const fits=d.type==="above"?f>x:d.type==="below"?f<x:f===x;if(fits!==yes)d.cand[f]=false;}
  const ans=yes?{ar:`نعم، ${G(t,"يسكن","تسكن")} ${q[0]} ${FL[x].ar}.`,tr:`naʿam, ${G(t,"yaskunu","taskunu")} ${q[1]} ${FL[x].tr}.`}

  d.log.push({q:Q,a:ans,yes});d.n++;addStars(1);beep();
  if(candCount()===1)d.done=true;

}

function hintView(l){

  const words=plain.split(/\s+/).filter(Boolean), trw=(l.tr||"").split(/\s+/).filter(Boolean);

    keys=shuffle([...new Set(keys)].sort((a,b)=>b.length-a.length).slice(0,3));
    return `<div class="hint">${P("قُلها بنفسك! هذه كلمات تساعدك:","qulha bi-nafsik!")}</div><div class="keys">${keys.map(k=>`<span class="key">${k}</span>`).join("")}</div>${S.en?`<div class="en">${l.en}</div>`:""}`;
  }

}

  return {fajr:fmt(adj(fajr)),dhuhr:fmt(adj(dhuhr)+1/60),asr:fmt(adj(asr)),maghrib:fmt(adj(mag)+1/60),isha:fmt(adj(isha))};

/* ---------- mechanics ---------- */
function updateLifts(){S.lifts.forEach((l,i)=>{const d=$("disp"+i);if(d)d.textContent=l.out?"OUT":ar(l.f);
  const b=document.querySelector(`[data-lift="${i}"]`);if(!b)return;b.classList.toggle("open",l.open);const lp=b.querySelector(".lamp");if(lp)lp.classList.toggle("on",l.open);
  const a=b.querySelector(".arrows");a.className="arrows "+(l.dir?"go":"")+(l.dir==="▼"?" down":"");a.textContent=l.dir?"↑ ↑":"";});}
let arVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>/^ar/i.test(v.lang))||null;}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}catch(e){}
let annT=null;
function announce(text,tr){
  return; // spoken/caption announcements turned off
  const a=$("ann");a.innerHTML=`🔊 ${text}${S.tr?`<small>${tr}</small>`:""}`;a.hidden=false;clearTimeout(annT);annT=setTimeout(()=>{a.hidden=true;},2600);
  if(!S.sound)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=.9;speechSynthesis.speak(u);}catch(e){}
}
function openThen(l,fn){l.open=true;updateLifts();ding();setTimeout(()=>announce("وصل المصعد. فُتِحت الأبواب.","wasala al-misʿad. futihat al-abwab."),350);setTimeout(fn,600);}
function callNearest(){
  if(S.lift!==null||!(S.phase==="lift"||S.phase==="reception"))return;
  beep();S.closed=false;
  const all=S.lifts.map((l,i)=>({l,i})).sort((a,b)=>a.l.f-b.l.f||Math.random()-.5);
  const best=all.find(x=>!x.l.out);
  S.skipped=all[0].l.out?all[0].i:null;
  if(S.skipped!=null)alarm();
  S.lift=best.i;render();
  const l=best.l;
  moveTo(l,0,()=>openThen(l,()=>{S.arrived=true;render();scheduleClose(best.i);}));
}
// if the lift arrives but nobody is allowed in yet, its doors close after a few seconds
function scheduleClose(i){
  const rid=S.rid;clearTimeout(S._ct);
  S._ct=setTimeout(()=>{
    if(S.rid!==rid||S.lift!==i||!S.arrived)return;
    const blocked=S.phase==="reception";
    if(!blocked)return;
    S.lifts[i].open=false;S.arrived=false;S.lift=null;S.closed=true;S.skipped=null;announce("أُغلِقت الأبواب.","ughliqat al-abwab.");
    render();
  },5000);
}
// you can only step in once the talk with the accountant (step 1) is finished
function enterLift(){
  if(S.lift===null||!S.arrived)return;
  if(S.phase==="reception"){const e=document.querySelector(".now");if(e){e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");}alarm();return;}
  if(S.phase!=="lift"||!S.ready)return;
  if(S.entering)return;
  S.entering=true;render();
  setTimeout(()=>{S.entering=false;S.phase="inside";S.pos=0;S.wrongAt=null;S.lifts[S.lift].open=false;render();announce("أُغلِقت الأبواب.","ughliqat al-abwab.");},1400);
}
function chooseLift(i){
  if(S.lift!==null)return;
  const l=S.lifts[i];
  if(l.out){S.outTried=i;alarm();render();return;}
  S.lift=i;render();
  moveTo(l,0,()=>openThen(l,()=>{S.phase="inside";S.pos=0;S.wrongAt=null;render();}));
}
let target=0;
function moveTo(l,to,done){
  l.open=false;updateLifts();const spd=Math.max(170,560-30*Math.abs(to-l.f));
  const step=()=>{
    if(l.f===to){l.dir="";updateLifts();setTimeout(done,300);return;}
    l.dir=to>l.f?"▲":"▼";l.f+=to>l.f?1:-1;beep();updateLifts();setTimeout(step,spd);
  };
  setTimeout(step,350);
}
function pressFloor(f){
  if(S.phase==="ride"&&f===S.final){cancelRide();return;}
  if(S.phase!=="inside")return;
  if(S.cancelFl!=null&&f===S.cancelFl){tone(200,.12);pop("✋",`ألغيتَ ${FL[f].ar}. اختر طابقاً آخر.`);return;}
  S.cancelFl=null;
  beep();
  if(f===S.pos)return;
  target=f;S.final=f;S.phase="ride";S.willStick=Math.abs(f-S.pos)>=2&&Math.random()<.25;
  S.nbMsg="";
  const mq=!!(S.mosque&&S.mosque.picked);
  const pickNb=(sf,dests)=>{
    const sides=[0,1,2,3].filter(x=>S.res[sf][x]&&!S.res[sf][x].home&&!(sf===S.t&&x===S.side));
    if(!sides.length||!dests.length)return false;
    S.nb={f:sf,r:S.res[sf][sides[Math.floor(Math.random()*sides.length)]],to:dests[Math.floor(Math.random()*dests.length)],aboard:false,done:false};
    target=sf;S.willStick=false;return true;
  };
  // going up from the ground floor: the lift stops on floor 1-6 for a neighbour
  if(S.pos===0&&f>=2&&!S.nbUp&&!mq){
    S.nbUp=1;const sf=1+Math.floor(Math.random()*Math.min(6,f-1));
    const fl=[];for(let x=sf+1;x<=TOP;x++)if(x!==f)fl.push(x);
    pickNb(sf,fl);
  }
  // going down to the mosque: someone else gets on and presses 0-6
  else if(mq&&f<S.pos&&S.pos-f>=2&&!S.nbDown){
    S.nbDown=1;const sf=f+1+Math.floor(Math.random()*(S.pos-f-1));
    const fl=[];for(let x=0;x<=Math.min(6,sf-1);x++)fl.push(x);
    pickNb(sf,fl);
  }
  if(S.lifts[S.lift].open)announce("أُغلِقت الأبواب.","ughliqat al-abwab.");
  S.lifts[S.lift].open=false;render();continueRide();
}
let RIDE=0;
function continueRide(){
  const l=S.lifts[S.lift];l.open=false;updateLifts();const spd=Math.max(170,560-30*Math.abs(target-l.f));
  const my=++RIDE;S.moving=true;if(S.phase==="ride")render();
  const step=()=>{
    if(my!==RIDE)return;                       // this ride was cancelled
    if(l.f===target){S.moving=false;l.dir="";updateLifts();atStop(l);return;}
    l.dir=target>l.f?"▲":"▼";l.f+=target>l.f?1:-1;beep();updateLifts();
    if(S.willStick&&l.f!==target&&Math.random()<.6){S.moving=false;S.willStick=false;S.stuck=true;S.phase="stuck";l.dir="";alarm();render();return;}
    setTimeout(step,spd);
  };
  setTimeout(step,350);
}
function nbTr(r,m,f){return G(r,m,f);}
// cancel the pressed floor while the lift is moving: it stops here and asks for a new floor
function cancelRide(){
  if(S.phase!=="ride"||!S.moving)return;
  RIDE++;S.moving=false;S.willStick=false;
  const l=S.lifts[S.lift];l.dir="";updateLifts();
  if(S.nb&&!S.nb.aboard)S.nb.done=true;     // a neighbour still waiting won't be picked up
  S.cancelFl=S.final;S.pos=l.f;S.final=null;S.wrongAt=null;S.phase="inside";tone(420,.1);tone(320,.12,.12);
  S.nbMsg=`<div class="alert">✋ ${P(`أُلغِي الزرّ. توقّف المصعد في ${FL[l.f].ar}.`,`ulghiya al-zirr. tawaqqafa al-misʿad fi ${FL[l.f].tr}.`)}
    <div class="ar big">${GV("إلى أيّ طابقٍ تريد أن تذهب الآن؟","إلى أيّ طابقٍ تريدين أن تذهبي الآن؟")}</div>${S.tr?`<div class="tr">${GV("ila ayyi tabiqin turidu an tadhhaba al-an?","ila ayyi tabiqin turidina an tadhhabi al-an?")}</div>`:""}${S.en?`<div class="en">Which floor do you want to go to now?</div>`:""}</div>`;
  render();
}
function atStop(l){
  const nb=S.nb;
  const dn=S.final<l.f||(nb&&nb.aboard&&nb.to<l.f&&S.final<=l.f);   // travelling down?
  const before=(x,y)=>dn?x>y:x<y;                                     // x comes before y on this trip
  // neighbour gets on
  if(nb&&!nb.aboard&&!nb.done&&l.f===nb.f){
    openThen(l,()=>{
      nb.aboard=true;
      S.nbMsg=`<div class="win nbmsg">🛗 ${P(`توقّف المصعد في ${FL[nb.f].ar}. ${G(nb.r,"دخلَ","دخلتْ")} ${nb.r.ar} ${nb.r.e} و${G(nb.r,"ضغطَ","ضغطتْ")} زرّ ${FL[nb.to].ar}.`,`tawaqqafa al-misʿad fi ${FL[nb.f].tr}. ${G(nb.r,"dakhala","dakhalat")} ${nb.r.tr} wa ${G(nb.r,"daghata","daghatat")} zirra ${FL[nb.to].tr}.`)}<div>${nb.r.e} «${P("السلام عليكم!","al-salamu ʿalaykum!")}»</div></div>`;
      beep();render();
      setTimeout(()=>{target=before(nb.to,S.final)?nb.to:S.final;render();continueRide();},2600);
    });
    return;
  }
  // neighbour gets off before us
  if(nb&&nb.aboard&&l.f===nb.to&&l.f!==S.final){
    openThen(l,()=>{nbOff();render();setTimeout(()=>{target=S.final;render();continueRide();},2200);});
    return;
  }
  // our floor
  S.pos=l.f;
  const mq=!!(S.mosque&&S.mosque.picked);
  const right=mq?S.pos===0:S.pos===S.t;
  if(nb&&nb.aboard&&nb.to===l.f){
    // the neighbour gets off here with us
    openThen(l,()=>{nbOff();if(!right)S.nbMsg="";arrive();});
    return;
  }
  if(nb&&nb.aboard&&before(l.f,nb.to)){
    if(right){
      // we get off; the lift keeps going with the neighbour
      openThen(l,()=>{arrive();setTimeout(()=>{l.open=false;updateLifts();keepGoing(l);},1700);});
    }else{
      // wrong floor: the doors open, then the lift carries on to the neighbour's floor
      const msg=mq?P(`هذا ${FL[l.f].ar}! ${OK().ar} ${OK().g==="f"?"قريبةٌ":"قريبٌ"} من الطابق الأرضي. المصعد سيكمل النزول…`,`hadha ${FL[l.f].tr}! al-misʿad sa-yukmilu al-nuzul…`)
                  :P(`هذا ${FL[l.f].ar}! لكنّ ${T().ar} ${G(T(),"ليس","ليست")} هنا. المصعد سيكمل ${dn?"النزول":"الصعود"}…`,`hadha ${FL[l.f].tr}! al-misʿad sa-yukmilu ${dn?"al-nuzul":"al-suʿud"}…`);
      openThen(l,()=>{S.wrongAt=l.f;S.phase="ride";S.nbMsg=`<div class="alert">🙈 ${msg}</div>`;render();
        setTimeout(()=>{target=nb.to;S.final=nb.to;continueRide();},2200);});
    }
    return;
  }
  if(nb&&nb.aboard&&l.f===nb.to){openThen(l,()=>{nbOff();S.phase="inside";render();});return;}
  S.nbMsg="";openThen(l,arrive);
}
function nbOff(){
  const nb=S.nb;nb.aboard=false;nb.done=true;
  S.nbMsg=`<div class="win nbmsg">👋 ${P(`${G(nb.r,"نزلَ","نزلتْ")} ${nb.r.ar} في ${FL[nb.to].ar}. ${G(nb.r,"قال","قالت")}: «مع السلامة!»`,`${G(nb.r,"nazala","nazalat")} ${nb.r.tr} fi ${FL[nb.to].tr}. ${G(nb.r,"qala","qalat")}: «maʿa al-salama!»`)}</div>`;
}
function keepGoing(l){
  const nb=S.nb,rid=S.rid;if(!nb)return;
  const step=()=>{
    if(l.f===nb.to){l.dir="";l.open=true;updateLifts();ding();nb.aboard=false;nb.done=true;setTimeout(()=>{l.open=false;updateLifts();},1500);return;}
    const up=nb.to>l.f;l.dir=up?"▲":"▼";l.f+=up?1:-1;updateLifts();setTimeout(step,420);
  };
  setTimeout(step,500);
}
function arrive(){
  if(S.mosque&&S.mosque.picked){
    if(S.pos===0){S.exiting=true;render();setTimeout(()=>{S.exiting=false;S.phase="mosque";S.lifts[S.lift].open=false;yay();render();if(outKind()==="mosque")playAdhan();},1500);return;}
    S.phase="inside";S.wrongAt=S.pos;render();return;
  }
  if(S.pos===S.t){
    S.exiting=true;render();
    setTimeout(()=>{S.exiting=false;S.phase="door";S.knocked=null;S.lifts[S.lift].open=false;yay();render();announce("أُغلِقت الأبواب.","ughliqat al-abwab.");},1500);
    return;}
  S.phase="inside";S.wrongAt=S.pos;render();
}
function knockDoor(s){knock();S.knocked=s;if(s===S.side&&(S.goHome||(!S.hide&&!S.res[S.pos][s].home)))yay();render();}

/* ---------- emojis as images, so they show on every device ---------- */
(function(){
  if(!window.twemoji)return;
  const OPT={folder:"svg",ext:".svg",base:"https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/"};
  const SKIP="select,option,textarea,input,script,style";
  let q=new Set(),busy=false,raf=0;
  const run=()=>{raf=0;busy=true;
    for(const n of q){const el=n.nodeType===1?n:n.parentElement;if(!el||!el.isConnected||el.closest(SKIP))continue;try{twemoji.parse(el,OPT);}catch(e){}}
    q.clear();busy=false;};
  const add=n=>{q.add(n);if(!raf)raf=requestAnimationFrame(run);};
  new MutationObserver(ms=>{if(busy)return;for(const m of ms){if(m.type==="characterData")add(m.target);else m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)add(n);});}})
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  add(document.body);
})();

function weekKey(){const d=new Date(),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-w"+Math.ceil(((t-y)/864e5+1)/7);}

function countOnce(key){
  if(!S.counted)S.counted={};if(S.counted[key])return;S.counted[key]=1;
  const c=PL[CUR].cnt||(PL[CUR].cnt={});c[key]=(c[key]||0)+1;c.all=(c.all||0)+1;
  if(key==="boss")PL[CUR].bossWeek=weekKey();
  saveHome();setTimeout(checkBadges,400);
}
function checkBadges(){
  const p=PL[CUR],c=p.cnt||{},got=p.badges||(p.badges=[]);let neu=null;
  BADGES.forEach(b=>{if(!got.includes(b.id)&&b.test(c,p)){got.push(b.id);neu=b;}});
  if(neu){saveHome();yay();confetti(40);pop("🏅",`وسامٌ جديد: ${neu.e} ${neu.ar}!`);updateMeta();}
}
var STREAK_RAN=false;
function runStreak(){
  if(STREAK_RAN||!AUTH)return;STREAK_RAN=true;
  const p=PL[CUR],today=dayKey(),y=new Date();y.setDate(y.getDate()-1);
  const st=p.streak||{};if(st.last===today){updateMeta();return;}
  const n=st.last===dayKey(y)?(st.n||0)+1:1;p.streak={last:today,n};
  let msg;
  if(Math.random()<.5){const g=giveGift(CUR);msg=g!=null?`مفاجأة اليوم: ${FURN[g][0]} ${FURN[g][1]} في شقّتك!`:"مفاجأة اليوم: ٥ نجوم!";}
  else{S.stars+=3;p.stars=S.stars;msg="مفاجأة اليوم: ٣ نجوم! ⭐⭐⭐";}
  saveHome();render();
  setTimeout(()=>{yay();confetti(30);pop("🔥",`${ar(n)} ${n===1?"يوم":n===2?"يومان":"أيام"} متتالية! ${msg}`);},600);
  setTimeout(checkBadges,2500);
}
setTimeout(runStreak,6000);
function updateMeta(){
  const p=PL[CUR],st=p.streak;
  const sb=$("streakB");if(sb)sb.textContent=st&&st.n?`🔥 ${ar(st.n)}`:"";
  const bn=$("badgeN");if(bn)bn.textContent=ar((p.badges||[]).length);
  const tot=weekStars("ib")+weekStars("by"),wg=$("weekGoal");
  if(wg)wg.innerHTML=tot>=WEEK_GOAL?`🌳 ${P("حديقة السطح جاهزة! بنيتماها معاً","hadiqat al-sath jahiza!")}`
    :`🌱 ${P(`هدفكما هذا الأسبوع: حديقة السطح ${ar(tot)}/${ar(WEEK_GOAL)}`,`hadafukuma: ${tot}/${WEEK_GOAL}`)}<span class="wbar"><i style="width:${Math.min(100,tot/WEEK_GOAL*100)}%"></i></span>`;
}
function openBadges(){
  const o=$("advBox"),p=PL[CUR],got=p.badges||[];
  o.innerHTML=`<div class="homecard advcard"><div class="homehead"><h2>🏅 ${P(`أوسمة ${PL_INFO[CUR].name}`,"awsimati")} (${ar(got.length)}/${ar(BADGES.length)})</h2><button id="advX">✕</button></div>
    <div class="advgrid">${BADGES.map(b=>`<div class="badge ${got.includes(b.id)?"got":""}"><span class="be">${b.e}</span><b>${P(b.ar,b.tr)}</b><small>${got.includes(b.id)?"✓ حصلتَ عليه":b.need}</small></div>`).join("")}</div></div>`;
  o.hidden=false;$("advX").onclick=()=>{o.hidden=true;};o.onclick=e=>{if(e.target===o)o.hidden=true;};
}

/* ================= adventures menu ================= */
function openAdv(){
  const o=$("advBox"),bossDone=PL[CUR].bossWeek===weekKey(),oth=PL_INFO[other()],she=other()==="by";
  const card=(id,e,ar1,tr1,sub,dis)=>`<button class="advc" data-adv="${id}" ${dis?"disabled":""}><span class="ae">${e}</span><b>${P(ar1,tr1)}</b><small>${sub}</small></button>`;
  o.innerHTML=`<div class="homecard advcard"><div class="homehead"><h2>🎒 ${P("مغامرات جديدة","mughamarat jadida")}</h2><button id="advX">✕</button></div>
    <div class="advgrid">
      ${card("souq","🛒","السوبرماركت","al-subirmarkit","عربة، كاشير، بطاقة أو نقداً")}
      ${card("airport","✈️","المطار","al-matar","سافر إلى مدينة جديدة")}
      ${card("dinner","🍽️","عشاء في شقّتي","ʿasha' fi shaqqati","اطبخ وقدّم لضيفك")}
      ${card("boss","⚡","مهمّة الأسبوع","muhimmat al-usbuʿ",bossDone?"✓ أنجزتها هذا الأسبوع":"انقطعت الكهرباء!",bossDone)}
      ${card("cat","🐱","قطّة ضائعة","qitta daʾiʿa","ابحث واسأل الجيران")}
      ${card("key","🔑","مفتاح ضائع","miftah daʾiʿ","مَن وجد المفتاح؟")}
      ${card("secret","🕵️",`أين ${she?"تختبئ":"يختبئ"} ${oth.name}؟`,"ayna yakhtabi'?","اسأل أسئلة نعم/لا")}
      ${card("myres","🧑‍🎨","صمّم ساكناً","sammim sakinan","يسكن في العمارة")}
      ${card("album","🎧","ألبومي الصوتي","albumi al-sawti",`${ar((PL[CUR].album||[]).length)} تسجيل`)}
      ${card("badges","🏅","أوسمتي","awsimati",`${ar((PL[CUR].badges||[]).length)} من ${ar(BADGES.length)}`)}
    </div></div>`;
  o.hidden=false;$("advX").onclick=()=>{o.hidden=true;};o.onclick=e=>{if(e.target===o)o.hidden=true;};
  o.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.adv;o.hidden=true;
    if(k==="souq")startSouq();
    else if(["airport","dinner","boss"].includes(k))startPlace(k);
    else if(k==="cat"||k==="key")startLost(k);
    else if(k==="secret")startSecret();
    else if(k==="myres")openMyRes();
    else if(k==="album")openAlbum();
    else if(k==="badges")openBadges();
  });
}
function randApt(excl=[]){const c=[];for(let f=1;f<=TOP;f++)for(let s=0;s<4;s++){const r=S.res[f][s];if(r&&!r.home&&r!==RES_OF[other()]&&!excl.some(x=>x[0]===f&&x[1]===s))c.push([f,s]);}return c[Math.floor(Math.random()*c.length)];}
function startLost(kind){
  newRound(true);
  const [of,os]=randApt(),[hf,hs]=randApt([[of,os]]);
  S.lost={kind,owner:S.res[of][os]};Object.assign(S,{t:hf,side:hs,hide:false});render();
}
function startSecret(){
  newRound(true);
  const [f,s]=randApt();
  const r={e:"🥸",ar:"الساكن الغريب",tr:"al-sakin al-gharib",en:"the strange resident",g:"m",m:1,ab:"أنا ساكنٌ جديد… لا تسألني كثيراً!",abt:"",abe:""};
  S.secret={f,s,r};Object.assign(S,{t:f,side:s,hide:false});layout();
  S.secretPrev=S.detOn;S.detOn=true;S.det=newDet();render();
}

var CLIP=null;
function openRecClip(){
  const o=$("advBox");
  const draw=(state,msg)=>{
    o.innerHTML=`<div class="homecard advcard"><div class="homehead"><h2>🎙️ ${P("سجّل صوتك","sajjil sawtak")}</h2><button id="advX">✕</button></div>

      <div class="tog center">${state==="rec"?`<span class="recdot"></span> <b id="clipT">٠:٠٠</b> <button class="big huge" id="clipStop">⏹ ${P("أوقف واحفظ","awqif wa-ihfaz")}</button>`
        :state==="up"?`⏳ ${P("جارٍ الحفظ…","jarin al-hifz…")}`:`<button class="big huge" id="clipGo">🎙️ ${P("ابدأ التسجيل","ibda' al-tasjil")}</button>`}</div>
      ${msg?`<div class="hint center">${msg}</div>`:""}</div>`;
    o.hidden=false;$("advX").onclick=()=>{if(CLIP){try{CLIP.mr.stop();}catch(e){}CLIP.stream.getTracks().forEach(t=>t.stop());clearInterval(CLIP.timer);CLIP=null;}o.hidden=true;};
    const go=$("clipGo");if(go)go.onclick=start;const st=$("clipStop");if(st)st.onclick=stop;
  };
  const start=async()=>{
    if(!SB||!navigator.mediaDevices||!window.MediaRecorder){draw("idle","التسجيل يحتاج إلى إنترنت ومتصفّح يدعم الميكروفون.");return;}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){draw("idle","اسمح للعبة باستخدام الميكروفون.");return;}
    const type=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
    const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined),chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    CLIP={mr,chunks,stream,start:Date.now()};mr.start();draw("rec");
    CLIP.timer=setInterval(()=>{if(!CLIP)return;const sec=Math.floor((Date.now()-CLIP.start)/1000),el=$("clipT");if(el)el.textContent=ar(0)+":"+ar(String(sec).padStart(2,"0"));if(sec>=30)stop();},250);
  };
  const stop=()=>{
    const c=CLIP;if(!c)return;CLIP=null;clearInterval(c.timer);draw("up");
    c.mr.onstop=async()=>{c.stream.getTracks().forEach(t=>t.stop());
      try{const base=(c.mr.mimeType||"audio/webm").split(";")[0],ext=base.includes("mp4")?"m4a":base.includes("ogg")?"ogg":"webm";
        const path=`${CUR}/album-${Date.now().toString(36)}.${ext}`;
        const up=await SB.storage.from("tower-pics").upload(path,new Blob(c.chunks,{type:base}),{contentType:base});if(up.error)throw up.error;
        const url=SB.storage.from("tower-pics").getPublicUrl(path).data.publicUrl;
        const label=S.phase==="place"&&PLACES[S.place]?PLACES[S.place].ar:S.mosque?OK().ar:"مهمّة";
        (PL[CUR].album=PL[CUR].album||[]).push({url,ts:Date.now(),label});saveHome();addStars(1);
        o.hidden=true;yay();pop("🎧","حُفِظ صوتك في الألبوم!");
      }catch(e){draw("idle","تعذّر الحفظ، حاول مرّة أخرى.");}};
    try{c.mr.stop();}catch(e){c.mr.onstop();}
  };
  draw("idle");
}

function closeGame(win){const o=$("gameBox"),g=GAME;if(!g)return;if(g.raf)cancelAnimationFrame(g.raf);if(g.iv)clearInterval(g.iv);if(g.key)document.removeEventListener("keydown",g.key);GAME=null;o.hidden=true;o.innerHTML="";if(win&&g.done)g.done(g.score);}
const gHead=(e,t,tr)=>`<div class="ghead"><b>${e} ${P(t,tr)}</b><button id="gX">✕</button></div>`;

/* --- fly the plane: dodge clouds and birds, collect stars --- */
function gFlight(o){
  const g=GAME,city=(S.placeData&&S.placeData.city)||CITIES[0];g.lane=1;g.obs=[];g.t0=Date.now();g.dur=25000;g.last=0;
  o.innerHTML=`<div class="gcard">${gHead("🧑‍✈️",`قُد الطائرة إلى ${city[0]}!`,`qud al-ta'ira ila ${city[1]}!`)}
    <div class="ginfo"><span id="fScore">⭐ ٠</span><span id="fTime">⏱️ ٢٥</span><span id="fHits">💥 ٠</span></div>
    <div class="sky" id="sky"><div class="ground"></div><span class="plane2" id="plane">✈️</span></div>
    <div class="gcmd" id="fCmd">${P("اصعد وانزل لتتجنّب الغيوم والطيور، واجمع النجوم!","isʿad wa-inzil li-tatajannaba al-ghuyuma wal-tuyur!")}</div>
    <div class="tog center"><button class="big huge" id="fUp">⬆️ ${P("اصعد","isʿad")}</button><button class="big huge" id="fDown">⬇️ ${P("انزل","inzil")}</button></div></div>`;
  gBind(o);
  const sky=o.querySelector("#sky"),plane=o.querySelector("#plane");
  const setLane=l=>{g.lane=Math.max(0,Math.min(2,l));plane.style.top=(14+g.lane*33)+"%";tone(500+g.lane*120,.05);};
  setLane(1);
  o.querySelector("#fUp").onclick=()=>setLane(g.lane-1);o.querySelector("#fDown").onclick=()=>setLane(g.lane+1);
  g.key=e=>{if(e.key==="ArrowUp"){e.preventDefault();setLane(g.lane-1);}if(e.key==="ArrowDown"){e.preventDefault();setLane(g.lane+1);}};
  document.addEventListener("keydown",g.key);
  const CMDS=[["⬆️ اصعد! غيمةٌ أمامك!","isʿad! ghaymatun amamak!"],["⬇️ انزل! طائرٌ قادم!","inzil! ta'irun qadim!"],["⭐ اجمع النجمة!","ijmaʿ al-najma!"]];
  const step=ts=>{
    if(!GAME)return;const el=Date.now()-g.t0;
    if(ts-g.last>850){g.last=ts;const star=Math.random()<.3,lane=Math.floor(Math.random()*3);const sp=document.createElement("span");sp.className="ob";sp.textContent=star?"⭐":rnd(["☁️","⛈️","🦅","☁️"]);sp.style.top=(14+lane*33)+"%";sky.appendChild(sp);g.obs.push({el:sp,x:100,lane,star});
      if(!star&&lane===g.lane){const c=o.querySelector("#fCmd");c.innerHTML=P(...(lane===0?CMDS[1]:CMDS[0]));} else if(star){const c=o.querySelector("#fCmd");c.innerHTML=P(...CMDS[2]);}}
    g.obs.forEach(b=>{b.x-=1.25;b.el.style.left=b.x+"%";
      if(!b.hit&&b.x<16&&b.x>4&&b.lane===g.lane){b.hit=true;b.el.remove();
        if(b.star){g.score++;tone(1200,.08);tone(1600,.1,.08);o.querySelector("#fScore").textContent="⭐ "+ar(g.score);}
        else{g.hits++;tone(150,.2,0,"square",.08);plane.classList.remove("shake");void plane.offsetWidth;plane.classList.add("shake");o.querySelector("#fHits").textContent="💥 "+ar(g.hits);}}});
    g.obs=g.obs.filter(b=>{if(b.x<-8){b.el.remove();return false;}return !b.hit;});
    o.querySelector("#fTime").textContent="⏱️ "+ar(Math.max(0,Math.ceil((g.dur-el)/1000)));
    if(el>=g.dur){
      sky.classList.add("landing");plane.style.top="70%";
      o.querySelector("#fCmd").innerHTML=`🛬 ${P(`هبوطٌ آمن في ${city[0]}! جمعتَ ${ar(g.score)} نجوم.`,`hubutun amin fi ${city[1]}!`)}`;
      o.querySelector(".tog").innerHTML=`<button class="big huge" id="fDone">✅ ${P("أحسنتَ يا كابتن!","ahsanta ya kabtin!")}</button>`;
      o.querySelector("#fDone").onclick=()=>{if(g.score)addStars(Math.min(5,g.score));yay();closeGame(true);};
      return;}
    g.raf=requestAnimationFrame(step);};
  g.raf=requestAnimationFrame(step);
}

    ${msg?`<div class="alert">${msg}</div>`:""}
    ${g.i<ST.length?`<div class="ings">${order.filter(i=>i>=g.i).map(i=>`<button data-wd="${i}">${ST[i][0]}<b>${ST[i][1]}</b>${S.tr?`<small>${ST[i][2]}</small>`:""}</button>`).join("")}</div>`
      :`<div class="win center">💧 ${P("وضوءٌ صحيح! أحسنت.","wudu'un sahih! ahsant.")}</div><div class="tog center"><button class="big huge" id="wuDone">✅ ${P("انتهيتُ من الوضوء","intahaytu min al-wudu'")}</button></div>`}</div>`;
    gBind(o);
    o.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{const i=+b.dataset.wd;
      if(i===g.i){g.i++;g.score++;tone(700+g.i*60,.08);draw();}
      else{tone(160,.2,0,"square",.08);draw(`🙂 ${P(`ليس بعد! ما الخطوة رقم ${ar(g.i+1)}؟`,`laysa baʿd!`)}`);}});
    const d=o.querySelector("#wuDone");if(d)d.onclick=()=>{yay();closeGame(true);};
  };draw();
}
</script>
</body></html>
