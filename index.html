/* ---------- 🚕 taxi & directions ---------- */
var TAXI_SPOTS=[{e:"🕌",ar:"المسجد",x:0,y:0},{e:"🏥",ar:"المستشفى",x:4,y:0},{e:"🏫",ar:"المدرسة",x:2,y:0},{e:"🛒",ar:"السوق",x:0,y:2},{e:"🌳",ar:"الحديقة",x:4,y:2},{e:"🏖️",ar:"الشاطئ",x:0,y:4},{e:"✈️",ar:"المطار",x:4,y:4}];
function scTaxi(){
  const o=$("gameBox"),dest=lpick(TAXI_SPOTS),wrongs=lshuf(TAXI_SPOTS.filter(s=>s!==dest)).slice(0,2);GAME={kind:"taxi"};
  let car={x:2,y:4,h:0},step=0,moves=0,miss=0,log="",msg="",okLines=[],bad=[];
  const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],ROT=[0,90,180,270];
  const bub=(who,a,t)=>{log+=`<div class="phb ${who}"><b>${who==="me"?V().e:"👨‍✈️"}</b><div>${P(a,t||"")}</div></div>`;};
  const grid=()=>{let h=`<div class="tgrid">`;for(let y=0;y<5;y++)for(let x=0;x<5;x++){const s=TAXI_SPOTS.find(q=>q.x===x&&q.y===y),home=x===2&&y===4,isCar=car.x===x&&car.y===y;
      h+=`<div class="tc ${s===dest&&step>=1?"dest":""}">${s?`<span class="tl">${s.e}<small>${s.ar}</small></span>`:home?`<span class="tl">🏢<small>العمارة</small></span>`:""}${isCar?`<span class="tcar" style="transform:rotate(${ROT[car.h]}deg)">🚕</span>`:""}</div>`;}
    return h+`</div>`;};
  const draw=body=>{o.innerHTML=`<div class="gcard phcard lifecard">${gHead("🚕","التاكسي","al-taksi")}${step>=1?`<div class="lifesit">🎯 ${P(`أوصل التاكسي إلى ${dest.e} ${dest.ar}`,"")} · 🧭 ${P("السيّارة تنظر إلى الأمام حيث يشير السهم","")}</div>`:""}${grid()}<div class="phlog">${log}</div>${msg?`<div class="alert center">${msg}</div>`:""}${body}</div>`;
    o.hidden=false;gBind(o);const lg=o.querySelector(".phlog");if(lg)lg.scrollTop=1e5;o.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>act(b.dataset.tx));};
  const opts=list=>`<div class="phopts">${list.map(x=>`<button class="big" data-tx="${x[2]}">${P(x[0],x[1])}</button>`).join("")}</div>`;
  const pad=()=>`<div class="tpad"><button data-tx="L">⬅️ ${P("يساراً","yasaran")}</button><button data-tx="F">⬆️ ${P("إلى الأمام","ila al-amam")}</button><button data-tx="R">➡️ ${P("يميناً","yaminan")}</button><button data-tx="S" class="stop">✋ ${P("توقّف هنا","tawaqqaf huna")}</button></div>`;
  const fare=()=>3+moves;
  const show=()=>{msg=msg||"";
    if(step===0){draw(opts(lshuf([[`إلى ${dest.ar} من فضلك.`,"","ok"],[`إلى ${wrongs[0].ar} من فضلك.`,"","w"],[`إلى ${wrongs[1].ar} من فضلك.`,"","w"]])));}
    else if(step===1)draw(pad());
    else if(step===2){const f=fare();draw(opts(lshuf([[`تفضّل، هذه ${riyalAr(f)}.`,"","p"+f],[`تفضّل، هذه ${riyalAr(f+4)}.`,"","p"+(f+4)],[`تفضّل، هذه ${riyalAr(Math.max(1,f-2))}.`,"","p"+Math.max(1,f-2)]])));}
    else if(step===3)draw(opts([["شكراً، مع السلامة! 👋","shukran, maʿa al-salama!","bye"]]));};
  const act=a=>{msg="";
    if(step===0){if(a!=="ok"){miss++;bad.push({said:"وجهة خطأ",right:`إلى ${dest.ar}`});msg=`🤔 ${P(`أنت تريد الذهاب إلى ${dest.e} ${dest.ar}!`,"")}`;tone(200,.15);show();return;}
      bub("me",`إلى ${dest.ar} من فضلك.`);okLines.push(`إلى ${dest.ar} من فضلك.`);bub("them",`حاضر! ${GV("قُل","قولي")} لي: يميناً، يساراً، أو إلى الأمام 🧭`,"hadir!");step=1;show();return;}
    if(step===1){
      if(a==="L"||a==="R"){car.h=(car.h+(a==="R"?1:3))%4;const w=a==="R"?"يميناً":"يساراً";bub("me",w);bub("them",`حسناً، ${w}!`);tone(600,.05);if(!okLines.includes(w))okLines.push(w);}
      else if(a==="F"){const nx=car.x+DIRS[car.h][0],ny=car.y+DIRS[car.h][1];if(nx<0||ny<0||nx>4||ny>4){bub("me","إلى الأمام");bub("them","لا يوجد طريق هنا! 🚧");miss++;tone(200,.15);}else{car.x=nx;car.y=ny;moves++;bub("me","إلى الأمام");tone(500,.05);if(!okLines.includes("إلى الأمام"))okLines.push("إلى الأمام");}}
      else if(a==="S"){bub("me","توقّف هنا من فضلك.");if(car.x===dest.x&&car.y===dest.y){okLines.push("توقّف هنا من فضلك.");bub("them",`وصلنا إلى ${dest.ar} ${dest.e}! الأجرة ${riyalAr(fare())}.`,"wasalna!");yay();step=2;}else{miss++;bad.push({said:"توقّف في المكان الخطأ",right:`${dest.ar}`});bub("them",`هنا؟ لا أرى ${dest.ar} 🤔`);tone(200,.15);}}
      show();return;}
    if(step===2){const v=+a.slice(1);if(v!==fare()){miss++;msg=`🤔 ${P(`الأجرة ${riyalAr(fare())}!`,"")}`;tone(200,.15);show();return;}bub("me",`تفضّل، هذه ${riyalAr(v)}.`);bub("them","شكراً! في أمان الله 🚕");step=3;show();return;}
    if(step===3){bub("me","شكراً، مع السلامة! 👋");const stars=miss===0?3:miss<=2?2:1;addStars(stars);logAct("taxi",{ok:okLines.slice(0,8),bad,s:stars});wchAdd();countOnce("taxi");confetti(30);
      draw(`<div class="win center">${P(`وصلتَ إلى ${dest.ar}! 🧭`.replace("وصلتَ",GV("وصلتَ","وصلتِ")),"")} ${"⭐".repeat(stars)}</div><div class="tog center"><button class="big" id="lAgain">🔁 ${P("مشوار آخر","mishwar akhar")}</button><button class="big" id="lDone">✅ ${P("انتهيت","intahaytu")}</button></div>`);
      $("lAgain").onclick=()=>{closeGame(false);scTaxi();};$("lDone").onclick=()=>closeGame(false);}
  };
  bub("them","السلام عليكم! إلى أين؟ 🚕","al-salamu ʿalaykum! ila ayna?");show();
}
var LIFE_START={doctor:scDoctor,pharmacy:scPharmacy,barber:scBarber,restaurant:scRestaurant,taxi:scTaxi,emergency:()=>scEmergency(false),occasion:scOccasion,recipe:scRecipe};

function openReport(k){
  k=k||(CUR==="by"?"ib":CUR);const p=PL[k],wk=isoWeek(),L=(p.log||[]).filter(x=>x.w===wk),o=$("gameBox");GAME={kind:"report"};
  const cnt={};L.forEach(x=>{cnt[x.k]=(cnt[x.k]||0)+1;});
  const okP=[...new Set(L.flatMap(x=>x.ok||[]))].slice(-16),bad=L.flatMap(x=>(x.bad||[]).map(b=>Object.assign({k:x.k},b))).slice(-10),typed=L.filter(x=>x.k==="kids"&&x.said).slice(-10);
  const badBy={};bad.forEach(b=>{badBy[b.k]=(badBy[b.k]||0)+1;});const weak=Object.entries(badBy).sort((a,b)=>b[1]-a[1])[0];
  const life=L.filter(x=>LIFE_KINDS[x.k]),avg=life.length?(life.reduce((a,x)=>a+(x.s||0),0)/life.length):0;
  o.innerHTML=`<div class="gcard phcard repcard">${gHead("📊","تقرير الدرس","taqrir al-dars")}
    <div class="reptabs">${["ib","by"].map(x=>`<button class="${x===k?"on":""}" data-rk="${x}">${PL_INFO[x].e||""} ${PL_INFO[x].name}</button>`).join("")}</div>
    <div class="repgrid"><div><b>${ar((p.wkS&&p.wkS.w===wk)?p.wkS.n:0)}</b><small>⭐ نجوم هذا الأسبوع</small></div><div><b>${ar(L.filter(x=>x.k!=="kids").length)}</b><small>🎯 نشاطات</small></div><div><b>${life.length?ar(avg.toFixed(1)):"-"}</b><small>📈 متوسّط النجوم في المواقف</small></div><div>${rankChip(k)}<small>🏅 الرتبة · ${ar(plXp(k))} نقطة</small></div></div>
    ${wchHtml()}
    <h4>🎯 ماذا لعب هذا الأسبوع؟</h4><div class="repacts">${Object.keys(cnt).length?Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([kk,v])=>`<span>${(ACT_LBL[kk]||["•",kk])[0]} ${(ACT_LBL[kk]||["",kk])[1]} <b>×${ar(v)}</b></span>`).join(""):`<i>لا نشاط بعد هذا الأسبوع</i>`}</div>
    <h4>✅ جمل استعملها بشكل صحيح</h4><div class="repok">${okP.length?okP.map(x=>`<span>${x}</span>`).join(""):"<i>—</i>"}</div>
    <h4>❌ أخطاء تحتاج مراجعة</h4><div class="repbad">${bad.length?bad.reverse().map(b=>`<div>${(ACT_LBL[b.k]||["•"])[0]} <s>${b.said}</s> ← <b>${b.right}</b></div>`).join(""):"<i>لا أخطاء 👏</i>"}</div>
    <h4>✍️ ماذا كتب للأطفال؟</h4><div class="reptyped">${typed.length?typed.reverse().map(x=>`<div>«${esc(x.said)}»</div>`).join(""):"<i>—</i>"}</div>
    ${weak?`<div class="reptip">💡 اقتراح للدرس القادم: ركّزي على موقف <b>${(ACT_LBL[weak[0]]||["",weak[0]])[1]}</b> (${ar(weak[1])} أخطاء هذا الأسبوع).</div>`:""}
  </div>`;
  o.hidden=false;gBind(o);o.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{closeGame(false);openReport(b.dataset.rk);});
}

    ${card("occasion","🎁","مناسبة جار","munasabat jar","مبروك، سلامتك، حمداً لله على السلامة")}
    ${card("recipe","👵","وصفة الجدّة","wasfat al-jadda","افهم الأوامر واطبخ معها")}

    <div class="advsec">🎒 ${P("مغامرات أخرى","mughamarat ukhra")}</div>`);
  g.querySelectorAll("[data-life]").forEach(b=>b.onclick=()=>{$("advBox").hidden=true;const k=b.dataset.life;if(k==="report")openReport();else LIFE_START[k]();});};
